name: SAM Portable Zip

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: false
        default: ''
  push:
    tags: ['v*']

jobs:
  pack:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build & pack (portable)
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "$env:GITHUB_REF_NAME".TrimStart('v') }
          if (-not $v) { $v = Get-Date -Format 'yyyy.MM.dd.HHmm' }
          ./build/pack-sam.ps1 -Version $v

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAM_Portable
          path: build/dist/*.zip
          if-no-files-found: error

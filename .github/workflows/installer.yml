name: Build & Release SAM-BIM Installer 

on:
  push:
    tags: ['v*']   # e.g. v20251126.1
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v20251126.1). If tagging, this is ignored.'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.ver.outputs.version }}
    permissions:
      contents: read

    steps:
      - name: Checkout (with private submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: Sync & clean submodules
        shell: pwsh
        run: |
          git submodule sync --recursive
          git submodule foreach --recursive 'git reset --hard'
          git submodule foreach --recursive 'git clean -xfd'

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          if (-not $tag -or -not $tag.StartsWith('v')) { $tag = "${{ github.event.inputs.version }}" }
          if (-not $tag) { $tag = "v$(Get-Date -Format yyyyMMdd).${{ github.run_number }}" }
          "version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Version: $tag"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore (single node)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $msbuildArgs = @(
            '/t:Restore','/m:1','/nr:false','/v:m',
            '/p:Configuration=Release',
            '/p:UseSharedCompilation=false',
            '/p:RunPostBuildEvent=OnOutputUpdated',
            '/p:PostBuildEvent='
          )
          msbuild .\BuildAll_Release_net.csproj @msbuildArgs

      - name: Rebuild (single node)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $msbuildArgs = @(
            '/t:Rebuild','/m:1','/nr:false','/v:m',
            '/p:Configuration=Release',
            '/p:UseSharedCompilation=false',
            '/p:RunPostBuildEvent=OnOutputUpdated',
            '/p:PostBuildEvent='
          )
          msbuild .\BuildAll_Release_net.csproj @msbuildArgs
          
      - name: Stage payload for installer
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'

          $root  = (Get-Location).Path
          $issDir = Join-Path $root 'SAM_Installer'
          $stage = Join-Path $issDir 'build'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          function Copy-IfExists([string]$src,[string]$dest) {
            if (Test-Path $src) {
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
              Copy-Item "$src\*" $dest -Recurse -Force
            } else {
              Write-Host "WARN: $src not found (skipped)"
            }
          }

          function Find-CsprojInSubdir([string]$rootDir, [string]$subdir) {
            $dir = Join-Path $rootDir $subdir
            if (Test-Path $dir) {
              $proj = Get-ChildItem -Path $dir -Recurse -Filter '*.csproj' -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($proj) { 
                # Use ${subdir} so ':' isn't treated as part of the variable name
                Write-Host "Using project in ${subdir}: $($proj.FullName)"
                return $proj.FullName
              }
            }
            Write-Host "WARN: No .csproj found under $subdir"
            return $null
          }

          # 1) Core payload
          Copy-IfExists (Join-Path $root 'SAM_UI\build')          (Join-Path $stage 'SAM')
          Copy-IfExists (Join-Path $root 'SAM_Windows\build')     (Join-Path $stage 'SAMdependencies')
          Copy-IfExists (Join-Path $root 'SAM_Revit\references')  (Join-Path $stage 'Rhino.Inside')
          Copy-IfExists (Join-Path $root 'Documents\SAM')         (Join-Path $stage 'user\Documents\SAM')

          # 2) Rhino UI – build directly into build\SAM_Rhino_UI
          $rhinoStage = Join-Path $stage 'SAM_Rhino_UI'
          New-Item -ItemType Directory -Force -Path $rhinoStage | Out-Null

          $samRhinoUiProjPath = Find-CsprojInSubdir $root 'SAM_Rhino_UI'
          if ($samRhinoUiProjPath) {
            Write-Host "Building SAM_Rhino_UI (Release) -> $rhinoStage"
            msbuild $samRhinoUiProjPath /t:Rebuild /m:1 /nr:false /v:m `
              /p:Configuration=Release /p:UseSharedCompilation=false `
              /p:RunPostBuildEvent=Never `
              /p:OutDir=$rhinoStage
          } else {
            Write-Host "WARN: SAM_Rhino_UI project not found – Rhino packages will be empty."
          }

          # 3) Other SAM* repos (SAM_Tas, etc.) into build\SAM
          $exclude = @('SAM_UI','SAM_Windows','SAM_Rhino_UI','SAM_Revit','SAM_Revit_UI','SAM_Installer')
          Get-ChildItem -Path $root -Directory | Where-Object {
            $_.Name -like 'SAM*' -and ($exclude -notcontains $_.Name)
          } | ForEach-Object {
            $build = Join-Path $_.FullName 'build'
            if (Test-Path $build) {
              Copy-IfExists $build (Join-Path $stage 'SAM')
            }
          }

          # 4) Add Revit add-in template into build\SAM
          $addin = Join-Path $root 'SAM_Revit_UI\files\Addin\SAM.addin'
          if (Test-Path $addin) {
            New-Item -ItemType Directory -Force -Path (Join-Path $stage 'SAM') | Out-Null
            Copy-Item $addin (Join-Path $stage 'SAM') -Force
          } else {
            Write-Host "WARN: SAM.addin template not found at $addin"
          }

          # 5) Build per-year Revit payloads into build\SAM\Revit YYYY
          $samRevitProjPath   = Find-CsprojInSubdir $root 'SAM_Revit'
          $samRevitUiProjPath = Find-CsprojInSubdir $root 'SAM_Revit_UI'

          # IMPORTANT: run restore once so project.assets.json has net48-windows
          if ($samRevitProjPath) {
            Write-Host "dotnet restore (SAM_Revit) $samRevitProjPath"
            dotnet restore $samRevitProjPath
          }
          if ($samRevitUiProjPath) {
            Write-Host "dotnet restore (SAM_Revit_UI) $samRevitUiProjPath"
            dotnet restore $samRevitUiProjPath
          }

          if (-not $samRevitProjPath -and -not $samRevitUiProjPath) {
            Write-Host 'WARN: SAM_Revit and SAM_Revit_UI projects not found. Skipping per-year Revit payload build.'
          } else {
            $years = 2020..2026
            foreach ($year in $years) {
              $config = "Release$year"
              $outDir = Join-Path $stage ("SAM\Revit $year")
              New-Item -ItemType Directory -Force -Path $outDir | Out-Null

              if ($samRevitProjPath) {
                Write-Host "Building SAM_Revit $config -> $outDir"
                msbuild $samRevitProjPath /t:Rebuild /m:1 /nr:false /v:m `
                  /p:Configuration=$config /p:UseSharedCompilation=false `
                  /p:RunPostBuildEvent=Never `
                  /p:OutDir=$outDir
              }

              if ($samRevitUiProjPath) {
                Write-Host "Building SAM_Revit_UI $config -> $outDir"
                msbuild $samRevitUiProjPath /t:Rebuild /m:1 /nr:false /v:m `
                  /p:Configuration=$config /p:UseSharedCompilation=false `
                  /p:RunPostBuildEvent=Never `
                  /p:OutDir=$outDir
              }
            }
          }

          # 6) Debug listing of staged Rhino & Revit contents
          Write-Host "=== Staged SAM_Rhino_UI ==="
          if (Test-Path $rhinoStage) {
            Get-ChildItem -Path $rhinoStage -Recurse | Select-Object FullName
          } else {
            Write-Host "SAM_Rhino_UI stage folder missing."
          }

          $samStage = Join-Path $stage 'SAM'
          foreach ($year in 2020..2026) {
            $dir = Join-Path $samStage ("Revit $year")
            Write-Host "=== Staged SAM\Revit $year ==="
            if (Test-Path $dir) {
              Get-ChildItem -Path $dir -Recurse | Select-Object FullName
            } else {
              Write-Host "  (missing)"
            }
          }


      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Package installer
        shell: pwsh
        run: |
          $issDir = Resolve-Path 'SAM_Installer' -ErrorAction Stop
          $iscc   = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after install." }

          # OutputDir and base filename are configured inside Build_Installer.iss
          $outDir  = Join-Path $pwd 'dist'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $ver = '${{ steps.ver.outputs.version }}'
          $log = Join-Path $outDir 'iscc.log'

          Push-Location $issDir
          try {
            & "$iscc" `
              "/DVersion=$ver" `
              "/DAppVersion=$ver" `
              "Build_Installer.iss" 2>&1 | Tee-Object -FilePath $log

            if ($LASTEXITCODE -ne 0) {
              Write-Host "===== iscc.log ====="; Get-Content $log | Write-Host
              throw "ISCC failed ($LASTEXITCODE)"
            }
          }
          finally { Pop-Location }

      - name: Verify installer
        shell: pwsh
        run: |
          $exes = Get-ChildItem dist -Filter 'SAM_Install*.exe'
          if (-not $exes) { throw "Installer did not produce SAM_Install*.exe in dist." }
          $exes | Format-Table Name,Length,LastWriteTime -AutoSize

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAM_Install
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: SAM_Install
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name:     ${{ needs.build.outputs.version }}
          files:    ./dist/*.exe

name: Build & Release SAM-BIM Installer 

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v20251126.1)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.ver.outputs.version }}
    permissions:
      contents: read

    steps:
      - name: Checkout (with private submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: Sync & clean submodules
        shell: pwsh
        run: |
          git submodule sync --recursive
          git submodule foreach --recursive 'git reset --hard'
          git submodule foreach --recursive 'git clean -xfd'

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          if (-not $tag -or -not $tag.StartsWith('v')) {
            $tag = "${{ github.event.inputs.version }}"
          }
          if (-not $tag) {
            $tag = "v$(Get-Date -Format yyyyMMdd).${{ github.run_number }}"
          }
          "version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Version: $tag"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore (single node)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $msbuildArgs = @(
            '/t:Restore','/m:1','/nr:false','/v:m',
            '/p:Configuration=Release',
            '/p:UseSharedCompilation=false',
            '/p:RunPostBuildEvent=OnOutputUpdated',
            '/p:PostBuildEvent='
          )
          msbuild .\BuildAll_Release_net.csproj @msbuildArgs

      - name: Rebuild (single node)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $msbuildArgs = @(
            '/t:Rebuild','/m:1','/nr:false','/v:m',
            '/p:Configuration=Release',
            '/p:UseSharedCompilation=false',
            '/p:RunPostBuildEvent=OnOutputUpdated',
            '/p:PostBuildEvent='
          )
          msbuild .\BuildAll_Release_net.csproj @msbuildArgs

      - name: Stage payload for installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $root   = (Get-Location).Path
          $issDir = Join-Path $root 'SAM_Installer'
          $stage  = Join-Path $issDir 'build'

          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          function Copy-IfExists([string]$src,[string]$dest) {
            if (Test-Path $src) {
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
              Copy-Item "$src\*" $dest -Recurse -Force
            } else {
              Write-Host "WARN: $src not found (skipped)"
            }
          }

          # 1) Core SAM payload (same as before)
          Copy-IfExists (Join-Path $root 'SAM_UI\build')         (Join-Path $stage 'SAM')
          Copy-IfExists (Join-Path $root 'SAM_Windows\build')    (Join-Path $stage 'SAMdependencies')
          Copy-IfExists (Join-Path $root 'SAM_Revit\references') (Join-Path $stage 'Rhino.Inside')
          Copy-IfExists (Join-Path $root 'Documents\SAM')        (Join-Path $stage 'user\Documents\SAM')

          # 2) Rhino Yak package: harvest binaries from SAM_Rhino_UI build outputs
          $rhinoRoot    = Join-Path $root  'SAM_Rhino_UI'
          $yakRoot      = Join-Path $stage 'SAM_Rhino_UI'
          $yakVersion   = '1.0.0'
          $yakVersionDir = Join-Path $yakRoot $yakVersion

          if (Test-Path $yakRoot) { Remove-Item $yakRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $yakVersionDir | Out-Null

          if (Test-Path $rhinoRoot) {
            # All SAM* dll/rhp/gha in SAM_Rhino_UI tree (bin/Release, bin/Debug, etc.)
            $rhinoFiles = Get-ChildItem -Path $rhinoRoot -Recurse -File -ErrorAction SilentlyContinue |
                          Where-Object { $_.Name -like 'SAM.*' -and $_.Extension -in '.dll','.rhp','.gha' }

            if ($rhinoFiles.Count -eq 0) {
              Write-Host "WARN: No Rhino binaries found under $rhinoRoot; Yak package will be empty."
            } else {
              Write-Host "Staging $($rhinoFiles.Count) Rhino files into Yak package..."
              foreach ($f in $rhinoFiles) {
                $dest = Join-Path $yakVersionDir $f.Name
                Copy-Item $f.FullName $dest -Force
              }
            }
          } else {
            Write-Host "WARN: SAM_Rhino_UI directory not found at $rhinoRoot; Rhino package will be empty."
          }

          # manifest.txt with the version
          $manifestPath = Join-Path $yakRoot 'manifest.txt'
          Set-Content -Path $manifestPath -Value $yakVersion -Encoding utf8

          # 3) Other SAM* repo builds into build\SAM (unchanged)
          $exclude = @('SAM_UI','SAM_Windows','SAM_Rhino_UI','SAM_Revit','SAM_Revit_UI','SAM_Installer')
          Get-ChildItem -Path $root -Directory | Where-Object {
            $_.Name -like 'SAM*' -and ($exclude -notcontains $_.Name)
          } | ForEach-Object {
            $build = Join-Path $_.FullName 'build'
            if (Test-Path $build) {
              Copy-IfExists $build (Join-Path $stage 'SAM')
            }
          }

          # 4) Revit add-in template (SAM.addin) next to SAM payload
          $addin = Join-Path $root 'SAM_Revit_UI\files\Addin\SAM.addin'
          if (Test-Path $addin) {
            $samOut = Join-Path $stage 'SAM'
            New-Item -ItemType Directory -Force -Path $samOut | Out-Null
            Copy-Item $addin $samOut -Force
          } else {
            Write-Host "WARN: Revit add-in template not found at $addin"
          }

          # 5) Stage Revit assemblies per year into build\SAM\Revit YYYY
          $revitAssemblies = @(
            'SAM.Core.Revit.UI.dll',
            'SAM.Core.Grasshopper.Revit.dll',
            'SAM.Architectural.Grasshopper.Revit.dll',
            'SAM.Analytical.Grasshopper.Revit.dll'
          )
          $years = @('2020','2021','2022','2023','2024','2025','2026')
          $revitByYear = @{}

          Write-Host 'Scanning built outputs for Revit assemblies...'
          $allDlls = Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue |
                     Where-Object { $_.Name -in $revitAssemblies }

          foreach ($dll in $allDlls) {
            $year = $null
            foreach ($y in $years) {
              if ($dll.FullName -match $y) {
                $year = $y
                break
              }
            }
            if (-not $year) {
              Write-Host "WARN: Could not infer Revit year for $($dll.FullName)"
              continue
            }

            if (-not $revitByYear.ContainsKey($year)) {
              $revitByYear[$year] = @()
            }
            $revitByYear[$year] += $dll
          }

          if ($revitByYear.Count -eq 0) {
            Write-Host 'WARN: No Revit assemblies found; SAM\Revit YYYY folders will be empty.'
          } else {
            foreach ($year in $years) {
              if (-not $revitByYear.ContainsKey($year)) { continue }

              $targetDir = Join-Path $stage ("SAM\Revit $year")
              New-Item -ItemType Directory -Force -Path $targetDir | Out-Null

              Write-Host "Staging $($revitByYear[$year].Count) Revit assemblies into $targetDir"
              foreach ($dll in $revitByYear[$year]) {
                $dst = Join-Path $targetDir $dll.Name
                Copy-Item $dll.FullName $dst -Force
              }
            }
          }

          # 6) Convert SAM.*Grasshopper.*.dll in staging to .gha
          $dlls = Get-ChildItem -Path $stage -Recurse -Filter '*.dll' -ErrorAction SilentlyContinue |
                  Where-Object { $_.Name -like 'SAM.*Grasshopper*.dll' }
          $ghaCount = 0
          foreach ($dll in $dlls) {
            $gha = [System.IO.Path]::ChangeExtension($dll.FullName, '.gha')
            Copy-Item $dll.FullName $gha -Force
            $ghaCount++
          }
          Write-Host "GHA created: $ghaCount"




      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Package installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $issDir = Resolve-Path 'SAM_Installer' -ErrorAction Stop
          $iscc   = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found." }

          $outDir = Join-Path $issDir '..\dist'
          if (-not (Test-Path $outDir)) {
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          }

          $raw   = '${{ steps.ver.outputs.version }}'
          if (-not $raw) { $raw = 'v_local' }
          $safe  = ($raw -replace '[^0-9A-Za-z_.-]','_')
          $fname = "SAM_Install_$safe"

          Push-Location $issDir
          try {
            & $iscc "/O$outDir" "/F$fname" "/DVersion=$raw" "/DAppVersion=$raw" "Build_Installer.iss"
            if ($LASTEXITCODE -ne 0) {
              throw "ISCC failed ($LASTEXITCODE)"
            }
          }
          finally {
            Pop-Location
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAM_Install
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: SAM_Install
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name:     ${{ needs.build.outputs.version }}
          files:    ./dist/*.exe

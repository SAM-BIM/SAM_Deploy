name: Build & Release SAM-BIM Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v20251126.1)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.ver.outputs.version }}
    permissions:
      contents: read

    steps:
      - name: Checkout (with private submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: Sync & clean submodules
        shell: pwsh
        run: |
          git submodule sync --recursive
          git submodule foreach --recursive 'git reset --hard'
          git submodule foreach --recursive 'git clean -xfd'

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          if (-not $tag -or -not $tag.StartsWith('v')) {
            $tag = "${{ github.event.inputs.version }}"
          }
          if (-not $tag) {
            $tag = "v$(Get-Date -Format yyyyMMdd).${{ github.run_number }}"
          }
          "version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Version: $tag"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore (single node)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild `
            '.\BuildAll_Release_net.csproj' `
            '/t:Restore' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release' `
            '/p:UseSharedCompilation=false'

      - name: Rebuild (single node)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild `
            '.\BuildAll_Release_net.csproj' `
            '/t:Rebuild' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release' `
            '/p:UseSharedCompilation=false'

      - name: Rebuild SAM_Rhino_UI (with post-build)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $sln = 'SAM_Rhino_UI\SAM_Rhino_UI.sln'
          if (-not (Test-Path $sln)) {
            Write-Host "WARN: $sln not found; skipping SAM_Rhino_UI rebuild."
            return
          }

          msbuild `
            $sln `
            '/t:Rebuild' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release' `
            '/p:UseSharedCompilation=false' `
            '/p:RunPostBuildEvent=OnOutputUpdated'

      # -----------------------------------------------------------------------
      # STAGING: put everything the Inno script expects under SAM_Installer\build
      # -----------------------------------------------------------------------
      - name: Stage payload for installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $root   = (Get-Location).Path
          $issDir = Join-Path $root 'SAM_Installer'
          $stage  = Join-Path $issDir 'build'

          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          function Copy-IfExists([string]$src,[string]$dest) {
            if (Test-Path $src) {
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
              Copy-Item "$src\*" $dest -Recurse -Force
            }
            else {
              Write-Host "WARN: $src not found (skipped)"
            }
          }

          # ---- Core SAM payload (what ends up in %APPDATA%\SAM) --------------
          $samStage = Join-Path $stage 'SAM'
          New-Item -ItemType Directory -Force -Path $samStage | Out-Null

          Copy-IfExists (Join-Path $root 'SAM_UI\build')          $samStage
          Copy-IfExists (Join-Path $root 'SAM_Windows\build')     (Join-Path $stage 'SAMdependencies')
          Copy-IfExists (Join-Path $root 'SAM_Revit\references')  (Join-Path $stage 'Rhino.Inside')
          Copy-IfExists (Join-Path $root 'Documents\SAM')         (Join-Path $stage 'user\Documents\SAM')

          # Copy outputs from ALL other SAM_* modules into %APPDATA%\SAM.
          # (We skip SAM_Revit* because those go into year folders.)
          $exclude = @('SAM_Installer','SAM_UI','SAM_Windows','SAM_Revit','SAM_Revit_UI','SAM_Rhino_UI','Documents')
          Get-ChildItem -Path $root -Directory -Filter 'SAM_*' | ForEach-Object {
            if ($exclude -contains $_.Name) { return }
            $b = Join-Path $_.FullName 'build'
            if (Test-Path $b) {
              Write-Host "Copy module build -> SAM: $($_.Name)"
              Copy-Item "$b\*" $samStage -Recurse -Force
            }
          }

          # Ensure SAM.addin template is available (Inno decides final install location)
          $addinTemplate = Join-Path $root 'SAM_Revit_UI\files\Addin\SAM.addin'
          if (Test-Path $addinTemplate) {
            Copy-Item $addinTemplate $samStage -Force
          } else {
            Write-Host "WARN: Revit add-in template not found at $addinTemplate"
          }

          # ---- Create GHAs for core SAM: ONLY Grasshopper DLLs ----------------
          $coreGhDlls = Get-ChildItem -Path $samStage -Recurse -File -Filter *.dll -ErrorAction SilentlyContinue |
                        Where-Object { $_.Name -match '^SAM\..*Grasshopper.*\.dll$' }

          foreach ($dll in $coreGhDlls) {
            $gha = [IO.Path]::ChangeExtension($dll.FullName, '.gha')
            Copy-Item $dll.FullName $gha -Force
          }

          # Safety: remove any accidental non-Grasshopper SAM*.gha
          Get-ChildItem -Path $samStage -Recurse -File -Filter 'SAM*.gha' -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch 'Grasshopper' } |
            Remove-Item -Force -ErrorAction SilentlyContinue

          # ---- Revit payload (per year) -> build\SAM\Revit 20xx\ -------------
          $revitYears = @('2025','2026')

          # Seed each year folder with ALL core SAM files (this is what you’re missing)
          foreach ($year in $revitYears) {
            $targetDir = Join-Path $samStage ("Revit $year")
            New-Item -ItemType Directory -Force -Path $targetDir | Out-Null

            Get-ChildItem -Path $samStage -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch "\\Revit\s20[0-9]{2}\\" } |
              ForEach-Object {
                Copy-Item $_.FullName (Join-Path $targetDir $_.Name) -Force
              }
          }

          # Overlay Revit-specific outputs (SAM_Revit + SAM_Revit_UI)
          $revitRoots = @(
            (Join-Path $root 'SAM_Revit'),
            (Join-Path $root 'SAM_Revit_UI')
          )

          $revitNameRegex = '^SAM\..*Revit.*\.(dll|pdb|xml|config|json)$'
          $best = @{}
          foreach ($year in $revitYears) { $best[$year] = @{} }

          foreach ($rr in $revitRoots) {
            if (-not (Test-Path $rr)) { continue }

            Get-ChildItem -Path $rr -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -match $revitNameRegex -and
                $_.FullName -notmatch '\\obj\\' -and
                $_.FullName -notmatch '\\ref\\' -and
                $_.FullName -notmatch '\\packages\\'
              } | ForEach-Object {

                $f = $_
                $targets = @()
                if ($f.FullName -match '2025') { $targets += '2025' }
                if ($f.FullName -match '2026') { $targets += '2026' }
                if ($targets.Count -eq 0) { $targets = $revitYears } # shared binaries -> both years

                $w = 0
                if ($f.FullName -match '\\build\\') { $w = 2 }
                elseif ($f.FullName -match '\\bin\\') { $w = 1 }

                foreach ($year in $targets) {
                  $existing = $best[$year][$f.Name]
                  if (-not $existing -or
                      $w -gt $existing.Weight -or
                      ($w -eq $existing.Weight -and $f.LastWriteTime -gt $existing.File.LastWriteTime)) {
                    $best[$year][$f.Name] = [pscustomobject]@{ Weight = $w; File = $f }
                  }
                }
              }
          }

          foreach ($year in $revitYears) {
            $targetDir = Join-Path $samStage ("Revit $year")

            foreach ($kvp in $best[$year].GetEnumerator()) {
              Copy-Item $kvp.Value.File.FullName (Join-Path $targetDir $kvp.Key) -Force
            }

            # Convert ONLY Grasshopper DLLs -> GHA
            Get-ChildItem -Path $targetDir -File -Filter *.dll -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match 'Grasshopper' } |
              ForEach-Object {
                $gha = [IO.Path]::ChangeExtension($_.FullName, '.gha')
                Copy-Item $_.FullName $gha -Force
              }

            # Safety: keep only Grasshopper GHAs
            Get-ChildItem -Path $targetDir -File -Filter 'SAM*.gha' -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notmatch 'Grasshopper' } |
              Remove-Item -Force -ErrorAction SilentlyContinue

            $dllCount = (Get-ChildItem -Path $targetDir -File -Filter *.dll -ErrorAction SilentlyContinue | Measure-Object).Count
            $ghaCount = (Get-ChildItem -Path $targetDir -File -Filter *.gha -ErrorAction SilentlyContinue | Measure-Object).Count
            Write-Host "Revit $year staged: DLL=$dllCount, GHA=$ghaCount"
          }

          # ---- Rhino UI Yak-style package -> build\SAM_Rhino_UI\1.0.0\* ------
          $rhinoProjRoot = Join-Path $root 'SAM_Rhino_UI'
          $yakRoot       = Join-Path $stage 'SAM_Rhino_UI'
          $yakVersion    = '1.0.0'
          $yakVersionDir = Join-Path $yakRoot $yakVersion
          New-Item -ItemType Directory -Force -Path $yakVersionDir | Out-Null

          $buildDir = Join-Path $rhinoProjRoot 'build'
          if (Test-Path $buildDir) {
            Write-Host "Staging Rhino payload from $buildDir -> $yakVersionDir"
            Copy-Item "$buildDir\*" $yakVersionDir -Recurse -Force
          } else {
            Write-Host "WARN: SAM_Rhino_UI\build not found; Rhino package may be incomplete."
          }

          # Yak manifest
          $manifestPath = Join-Path $yakRoot 'manifest.txt'
          Set-Content -Path $manifestPath -Value $yakVersion -Encoding ascii

          # Remove any .gha from the Rhino package (GHAs stay under %APPDATA%\SAM)
          Get-ChildItem -Path $yakVersionDir -Recurse -Filter *.gha -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Package installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $issDir = Resolve-Path 'SAM_Installer' -ErrorAction Stop
          $iscc   = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found." }

          $outDir = Join-Path $issDir '..\dist'
          if (-not (Test-Path $outDir)) {
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          }

          $raw   = '${{ steps.ver.outputs.version }}'
          if (-not $raw) { $raw = 'v_local' }
          $safe  = ($raw -replace '[^0-9A-Za-z_.-]','_')
          $fname = "SAM_Install_$safe"

          Push-Location $issDir
          try {
            & $iscc "/O$outDir" "/F$fname" "/DVersion=$raw" "/DAppVersion=$raw" "Build_Installer.iss"
            if ($LASTEXITCODE -ne 0) {
              throw "ISCC failed ($LASTEXITCODE)"
            }
          }
          finally {
            Pop-Location
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAM_Install
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: SAM_Install
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name:     ${{ needs.build.outputs.version }}
          files:    ./dist/*.exe

name: Build & Release SAM-BIM Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v20251215.1). If empty a timestamp is used.'
        required: false
        default: ''
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.ver.outputs.version }}
    permissions:
      contents: read

    steps:
      - name: Checkout (with private submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: Sync & clean submodules
        shell: pwsh
        run: |
          git submodule sync --recursive
          git submodule foreach --recursive 'git reset --hard'
          git submodule foreach --recursive 'git clean -xfd'

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          if (-not $tag -or -not $tag.StartsWith('v')) { $tag = "${{ github.event.inputs.version }}" }
          if (-not $tag) { $tag = "v$(Get-Date -Format yyyyMMdd).${{ github.run_number }}" }
          "version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Version: $tag"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore (single node)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          msbuild .\BuildAll_Release_net.csproj /t:Restore /m:1 /nr:false /v:m `
            /p:Configuration=Release /p:UseSharedCompilation=false `
            /p:RunPostBuildEvent=OnOutputUpdated /p:PostBuildEvent=

      - name: Rebuild (single node)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          msbuild .\BuildAll_Release_net.csproj /t:Rebuild /m:1 /nr:false /v:m `
            /p:Configuration=Release /p:UseSharedCompilation=false `
            /p:RunPostBuildEvent=OnOutputUpdated /p:PostBuildEvent=

      - name: Stage payload for installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root  = (Get-Location).Path
          $issDir = Join-Path $root 'SAM_Installer'
          $stage = Join-Path $issDir 'build'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          function Copy-IfExists([string]$src,[string]$dest) {
            if (Test-Path $src) {
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
              Copy-Item "$src\*" $dest -Recurse -Force
            } else {
              Write-Host "WARN: $src not found (skipped)"
            }
          }

          function Find-CsprojInSubdir([string]$rootPath,[string]$folderName) {
            $dir = Join-Path $rootPath $folderName
            if (-not (Test-Path $dir)) { return $null }
            $proj = Get-ChildItem -Path $dir -Recurse -Filter '*.csproj' -ErrorAction SilentlyContinue |
                    Select-Object -First 1
            if ($proj) { return $proj.FullName }
            return $null
          }

          # 1) Core staged payload
          Copy-IfExists (Join-Path $root 'SAM_UI\build')          (Join-Path $stage 'SAM')
          Copy-IfExists (Join-Path $root 'SAM_Windows\build')     (Join-Path $stage 'SAMdependencies')
          Copy-IfExists (Join-Path $root 'SAM_Revit\references')  (Join-Path $stage 'Rhino.Inside')
          Copy-IfExists (Join-Path $root 'Documents\SAM')         (Join-Path $stage 'user\Documents\SAM')

          # 2) Rhino UI payload -> SAM_Installer\build\SAM_Rhino_UI
          $rhinoStage = Join-Path $stage 'SAM_Rhino_UI'
          New-Item -ItemType Directory -Force -Path $rhinoStage | Out-Null

          $samRhinoUiProj = Find-CsprojInSubdir $root 'SAM_Rhino_UI'
          if ($samRhinoUiProj) {
            Write-Host "Building SAM_Rhino_UI from $samRhinoUiProj -> $rhinoStage"
            & msbuild $samRhinoUiProj /t:Rebuild /m:1 /nr:false /v:m `
              /p:Configuration=Release /p:UseSharedCompilation=false `
              /p:RunPostBuildEvent=Never /p:OutDir="$rhinoStage\"
          } else {
            Write-Host 'WARN: SAM_Rhino_UI project not found; Rhino package payload may be missing.'
          }

          # 3) Bring in other SAM* repo builds (if they have a \build folder)
          $exclude = @('SAM_UI','SAM_Windows','SAM_Rhino_UI','SAM_Revit','SAM_Revit_UI','SAM_Installer')
          Get-ChildItem -Path $root -Directory | Where-Object {
            $_.Name -like 'SAM*' -and ($exclude -notcontains $_.Name)
          } | ForEach-Object {
            $build = Join-Path $_.FullName 'build'
            if (Test-Path $build) {
              Copy-IfExists $build (Join-Path $stage 'SAM')
            }
          }

          # 4) Revit add-in template (SAM.addin) copied next to SAM payload
          $addin = Join-Path $root 'SAM_Revit_UI\files\Addin\SAM.addin'
          if (Test-Path $addin) {
            $samOut = Join-Path $stage 'SAM'
            New-Item -ItemType Directory -Force -Path $samOut | Out-Null
            Copy-Item $addin $samOut -Force
          } else {
            Write-Host "WARN: Revit add-in template not found at $addin"
          }

          # 5) Stage Revit plugin payloads into build\SAM\Revit YYYY
          $revitAssemblies = @(
            'SAM.Core.Revit.UI.dll',
            'SAM.Core.Grasshopper.Revit.dll',
            'SAM.Architectural.Grasshopper.Revit.dll',
            'SAM.Analytical.Grasshopper.Revit.dll'
          )

          $revitByYear = @{}

          Write-Host 'Scanning built outputs for Revit assemblies...'
          $allDlls = Get-ChildItem -Path $root -Recurse -Filter *.dll -ErrorAction SilentlyContinue

          foreach ($dll in $allDlls) {
            if ($revitAssemblies -notcontains $dll.Name) { continue }

            $dir = $dll.DirectoryName
            $year = $null

            if ($dir -match 'Release(20[0-9]{2})') {
              $year = $Matches[1]
            } elseif ($dir -match 'Debug(20[0-9]{2})') {
              $year = $Matches[1]
            } elseif ($dir -match 'Revit[\s_]*(20[0-9]{2})') {
              $year = $Matches[1]
            }

            if (-not $year) {
              Write-Host "WARN: Could not infer Revit year from path: $($dll.FullName)"
              continue
            }

            if (-not $revitByYear.ContainsKey($year)) {
              $revitByYear[$year] = @{}
            }

            $revitByYear[$year][$dll.Name] = $dll.FullName
          }

          if ($revitByYear.Count -eq 0) {
            Write-Host 'WARN: No Revit assemblies were found in build outputs; SAM\Revit YYYY folders will be empty.'
          } else {
            foreach ($year in @('2020','2021','2022','2023','2024','2025','2026')) {
              if (-not $revitByYear.ContainsKey($year)) { continue }

              $targetDir = Join-Path $stage ("SAM\Revit $year")
              New-Item -ItemType Directory -Force -Path $targetDir | Out-Null

              Write-Host "Staging Revit payload for $year into $targetDir"
              foreach ($asmName in $revitAssemblies) {
                if ($revitByYear[$year].ContainsKey($asmName)) {
                  $src = $revitByYear[$year][$asmName]
                  $dst = Join-Path $targetDir $asmName
                  Copy-Item $src $dst -Force
                } else {
                  Write-Host "WARN: $asmName not found for Revit $year"
                }
              }
            }
          }

          # 6) Convert any SAM.*Grasshopper.*.dll under build root into .gha
          $stageRoot = Resolve-Path 'SAM_Installer\build' -ErrorAction Stop
          $dlls = Get-ChildItem -Path $stageRoot -Recurse -Filter *.dll |
                  Where-Object { $_.Name -match '^SAM\..*Grasshopper.*\.dll$' }
          $count = 0
          foreach ($dll in $dlls) {
            $gha = [IO.Path]::ChangeExtension($dll.FullName, '.gha')
            Copy-Item $dll.FullName $gha -Force
            $count++
          }
          Write-Host "GHA created: $count"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Ensure CI .iss exists (sanitize)
        shell: pwsh
        run: |
          $issDir = Resolve-Path 'SAM_Installer' -ErrorAction Stop
          $src = Join-Path $issDir 'Build_Installer.iss'
          $ci  = Join-Path $issDir 'Build_Installer.CI.iss'
          if (-not (Test-Path $src)) { throw "Missing $src" }
          (Get-Content $src -Raw) `
            -replace '(?im)^[ \t]*OutputBaseFile(Name)?\s*=.*$', '' `
            -replace '(?im)^[ \t]*OutputDir\s*=.*$', '' |
            Set-Content -Path $ci -Encoding UTF8
          Get-Item $ci | Format-List FullName,Length,LastWriteTime

      - name: Compile installer (ISCC) using CI script
        shell: pwsh
        run: |
          $issDir = Resolve-Path 'SAM_Installer' -ErrorAction Stop
          $ci     = Join-Path $issDir 'Build_Installer.CI.iss'
          if (-not (Test-Path $ci)) { throw "Missing $ci" }

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found." }

          $outDir = Join-Path $pwd 'dist'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $raw   = '${{ steps.ver.outputs.version }}'
          $safe  = ($raw -replace '[^0-9A-Za-z_.-]','_')
          $fname = "SAM_Install_$safe"

          $args = @("/O$outDir", "/F$fname", "/DVersion=$raw", "/DAppVersion=$raw", $ci)
          & $iscc @args
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAM_Install
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: SAM_Install
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name:     ${{ needs.build.outputs.version }}
          files:    ./dist/*.exe

name: Build & Release SAM-BIM Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v20251215.1). If empty a timestamp is used.'
        required: false
        default: ''
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.ver.outputs.version }}
    permissions:
      contents: read

    steps:
      - name: Checkout (with private submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: Sync & clean submodules
        shell: pwsh
        run: |
          git submodule sync --recursive
          git submodule foreach --recursive 'git reset --hard'
          git submodule foreach --recursive 'git clean -xfd'

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          if (-not $tag -or -not $tag.StartsWith('v')) { $tag = "${{ github.event.inputs.version }}" }
          if (-not $tag) { $tag = "v$(Get-Date -Format yyyyMMdd).${{ github.run_number }}" }
          "version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Version: $tag"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore (single node)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          msbuild .\BuildAll_Release_net.csproj /t:Restore /m:1 /nr:false /v:m `
            /p:Configuration=Release /p:UseSharedCompilation=false `
            /p:RunPostBuildEvent=OnOutputUpdated /p:PostBuildEvent=

      - name: Rebuild (single node)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          msbuild .\BuildAll_Release_net.csproj /t:Rebuild /m:1 /nr:false /v:m `
            /p:Configuration=Release /p:UseSharedCompilation=false `
            /p:RunPostBuildEvent=OnOutputUpdated /p:PostBuildEvent=

      - name: Stage payload for installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root  = (Get-Location).Path
          $issDir = Join-Path $root 'SAM_Installer'
          $stage = Join-Path $issDir 'build'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          function Copy-IfExists([string]$src,[string]$dest) {
            if (Test-Path $src) {
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
              Copy-Item "$src\*" $dest -Recurse -Force
            } else {
              Write-Host "WARN: $src not found (skipped)"
            }
          }

          # 1) Core staged payload
          Copy-IfExists (Join-Path $root 'SAM_UI\build')          (Join-Path $stage 'SAM')
          Copy-IfExists (Join-Path $root 'SAM_Windows\build')     (Join-Path $stage 'SAMdependencies')
          Copy-IfExists (Join-Path $root 'SAM_Revit\references')  (Join-Path $stage 'Rhino.Inside')
          Copy-IfExists (Join-Path $root 'Documents\SAM')         (Join-Path $stage 'user\Documents\SAM')

          # 2) Bring in ALL other SAM* repo builds (if they have a \build folder)
          $exclude = @('SAM_UI','SAM_Windows','SAM_Revit','SAM_Revit_UI','SAM_Installer')
          Get-ChildItem -Path $root -Directory | Where-Object {
            $_.Name -like 'SAM*' -and ($exclude -notcontains $_.Name)
          } | ForEach-Object {
            $build = Join-Path $_.FullName 'build'
            if (Test-Path $build) {
              Copy-IfExists $build (Join-Path $stage 'SAM')
            }
          }

          # 3) Revit add-in template (SAM.addin) copied next to SAM payload
          $addin = Join-Path $root 'SAM_Revit_UI\files\Addin\SAM.addin'
          if (Test-Path $addin) {
            $samOut = Join-Path $stage 'SAM'
            New-Item -ItemType Directory -Force -Path $samOut | Out-Null
            Copy-Item $addin $samOut -Force
          } else {
            Write-Host "WARN: Revit add-in template not found at $addin"
          }

          # 4) Stage Revit plugin payloads into build\SAM\Revit YYYY
          Write-Host 'Scanning built outputs for Revit assemblies...'
          $revitDlls = Get-ChildItem -Path $root -Recurse -Filter 'SAM.*Revit*.dll' -ErrorAction SilentlyContinue

          if (-not $revitDlls) {
            Write-Host 'WARN: No SAM.*Revit*.dll assemblies found; SAM\Revit YYYY folders will be empty.'
          } else {
            $byYear = @{}

            foreach ($dll in $revitDlls) {
              $dir  = $dll.DirectoryName
              $year = $null

              if ($dir -match 'Release(20[0-9]{2})') {
                $year = $Matches[1]
              } elseif ($dir -match 'Debug(20[0-9]{2})') {
                $year = $Matches[1]
              } elseif ($dir -match 'Revit[\s_]*(20[0-9]{2})') {
                $year = $Matches[1]
              }

              if (-not $year) {
                Write-Host "WARN: Could not infer Revit year from path: $($dll.FullName)"
                continue
              }

              if (-not $byYear.ContainsKey($year)) {
                $byYear[$year] = @()
              }

              $byYear[$year] += $dll.FullName
            }

            foreach ($year in $byYear.Keys) {
              $targetDir = Join-Path $stage ("SAM\Revit $year")
              New-Item -ItemType Directory -Force -Path $targetDir | Out-Null

              Write-Host "Staging Revit payload for $year into $targetDir"
              foreach ($src in $byYear[$year]) {
                $fileName = [System.IO.Path]::GetFileName($src)
                Copy-Item $src (Join-Path $targetDir $fileName) -Force
              }
            }
          }

          # 5) Build Rhino Yak-style package under SAM_Installer\build\SAM_Rhino_UI
          $yakRoot = Join-Path $stage 'SAM_Rhino_UI'
          if (Test-Path $yakRoot) { Remove-Item $yakRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $yakRoot | Out-Null

          $yakVersion    = '1.0.0'
          $yakVersionDir = Join-Path $yakRoot $yakVersion
          New-Item -ItemType Directory -Force -Path $yakVersionDir | Out-Null

          $manifestPath = Join-Path $yakRoot 'manifest.txt'
          Set-Content -LiteralPath $manifestPath -Value $yakVersion

          $rhinoSourceRoot = Join-Path $root 'SAM_Rhino_UI'
          if (-not (Test-Path $rhinoSourceRoot)) {
            Write-Host "WARN: SAM_Rhino_UI directory not found at $rhinoSourceRoot; Rhino package will be empty."
          } else {
            $rhps = Get-ChildItem -Path $rhinoSourceRoot -Recurse -Filter '*.rhp' -ErrorAction SilentlyContinue
            if (-not $rhps) {
              Write-Host "WARN: No .rhp files found under $rhinoSourceRoot; Rhino package will be empty."
            } else {
              $pluginDirs = $rhps | Select-Object -ExpandProperty DirectoryName -Unique
              foreach ($dir in $pluginDirs) {
                Write-Host "Staging Rhino plugin files from $dir"
                Copy-Item (Join-Path $dir '*') $yakVersionDir `
                  -Include '*.rhp','*.dll','*.gha','*.xml','*.json','*.cfg','*.config' `
                  -Force -ErrorAction SilentlyContinue
              }
            }
          }


      - name: Normalize Rhino package structure (SAM_Rhino_UI)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Root of the Inno staging folder
          $stageRoot = Resolve-Path 'SAM_Installer\build' -ErrorAction Stop
          $samPkgRoot = Join-Path $stageRoot 'SAM_Rhino_UI'

          if (-not (Test-Path $samPkgRoot)) {
            Write-Host "SAM_Rhino_UI stage folder not found, skipping Rhino package normalization."
            return
          }

          # Rhino PackageManager layout:
          #   %APPDATA%\McNeel\Rhinoceros\packages\<7.0|8.0>\SAM\manifest.txt
          #   %APPDATA%\McNeel\Rhinoceros\packages\<7.0|8.0>\SAM\<version>\*files*
          $version = '1.0.0'

          $versionDir = Join-Path $samPkgRoot $version
          if (Test-Path $versionDir) {
            Remove-Item $versionDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $versionDir | Out-Null

          # Move all built files into the version folder
          Get-ChildItem -Path $samPkgRoot -Force |
            Where-Object { $_.Name -ne $version -and $_.Name -ne 'manifest.txt' } |
            ForEach-Object {
              $dest = Join-Path $versionDir $_.Name
              Move-Item $_.FullName $dest -Force
            }

          # Write manifest.txt with the active version
          $manifestPath = Join-Path $samPkgRoot 'manifest.txt'
          Set-Content -Path $manifestPath -Value $version -Encoding utf8

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Ensure CI .iss exists (sanitize)
        shell: pwsh
        run: |
          $issDir = Resolve-Path 'SAM_Installer' -ErrorAction Stop
          $src = Join-Path $issDir 'Build_Installer.iss'
          $ci  = Join-Path $issDir 'Build_Installer.CI.iss'
          if (-not (Test-Path $src)) { throw "Missing $src" }
          (Get-Content $src -Raw) `
            -replace '(?im)^[ \t]*OutputBaseFile(Name)?\s*=.*$', '' `
            -replace '(?im)^[ \t]*OutputDir\s*=.*$', '' |
            Set-Content -Path $ci -Encoding UTF8
          Get-Item $ci | Format-List FullName,Length,LastWriteTime

      - name: Compile installer (ISCC) using CI script
        shell: pwsh
        run: |
          $issDir = Resolve-Path 'SAM_Installer' -ErrorAction Stop
          $ci     = Join-Path $issDir 'Build_Installer.CI.iss'
          if (-not (Test-Path $ci)) { throw "Missing $ci" }

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found." }

          $outDir = Join-Path $pwd 'dist'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $raw   = '${{ steps.ver.outputs.version }}'
          $safe  = ($raw -replace '[^0-9A-Za-z_.-]','_')
          $fname = "SAM_Install_$safe"

          $args = @("/O$outDir", "/F$fname", "/DVersion=$raw", "/DAppVersion=$raw", $ci)
          & $iscc @args
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAM_Install
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: SAM_Install
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name:     ${{ needs.build.outputs.version }}
          files:    ./dist/*.exe

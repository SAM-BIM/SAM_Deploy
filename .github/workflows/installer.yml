name: Build & Release SAM-BIM Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v20251126.1)'
        required: false
        default: ''
      publish_release:
        description: 'Create GitHub Release on manual run'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.ver.outputs.version }}
    permissions:
      contents: read
    env:
      STRICT_UNCLASSIFIED_DRIFT: 'false'
      # SAM.Geometry.Grasshopper.OCCT has a BeforeTargets="Build" step that runs
      # build-native.ps1 (vcpkg/OCCT SDK), which fails on the runner. The native
      # engine is built by the dedicated "Build OCCT native engine" step instead,
      # so skip the in-project native build during the managed compile (same flag
      # SAM_OCCT's own build.yml uses).
      SAM_OCCT_SKIP_NATIVE_BUILD: 'true'

    steps:
      - name: Checkout (with private submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: Sync & clean submodules
        shell: pwsh
        run: |
          git submodule sync --recursive
          git submodule foreach --recursive 'git reset --hard'
          git submodule foreach --recursive 'git clean -xfd'

      - name: Clean local caches used for packaging
        shell: pwsh
        run: |
          $paths = @(
            (Join-Path $env:APPDATA 'SAM'),
            (Join-Path $env:APPDATA 'McNeel\Rhinoceros\packages\7.0\SAM'),
            (Join-Path $env:APPDATA 'McNeel\Rhinoceros\packages\8.0\SAM'),
            (Join-Path $env:APPDATA 'McNeel\Rhinoceros\packages\9.0\SAM')
          )

          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "Removing stale cache: $p"
              Remove-Item $p -Recurse -Force
            }
          }

      - name: Ensure Grasshopper folders exist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $env:APPDATA 'Grasshopper\Libraries') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $env:APPDATA 'Grasshopper\UserObjects\SAM') | Out-Null

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          if (-not $tag -or -not $tag.StartsWith('v')) {
            $tag = "${{ github.event.inputs.version }}"
          }
          if (-not $tag) {
            $tag = "v$(Get-Date -Format yyyyMMdd).${{ github.run_number }}"
          }

          # Normalise manual version strings so release/tag names stay valid.
          $tag = $tag.Trim()
          $tag = ($tag -replace '\s+','-')
          $tag = ($tag -replace '[^0-9A-Za-z_.-]','-')

          "version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Version: $tag"

      - name: Compute SAMVersion
        id: samver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Prefer head_ref when its a sow branch (release-promotion PRs from sow/* to main),
          # else use base_ref on PR events / ref_name on push/dispatch events.
          $headRef = '${{ github.head_ref }}'
          $baseRef = '${{ github.base_ref }}'
          $refName = '${{ github.ref_name }}'
          if ($headRef -match '^sow/\d{4}-Q\d$') {
            $ref = $headRef
          } elseif ('${{ github.event_name }}' -eq 'pull_request') {
            $ref = $baseRef
          } else {
            $ref = $refName
          }
          # .NET AssemblyVersion components are UInt16 (max 65535). Cap to 60000 for headroom.
          $run = ${{ github.run_number }} % 60000
          if ($ref -match 'sow/(\d{4})-Q(\d)') {
            $v = "$($Matches[1]).$($Matches[2]).$run.0"
            $src = "branch '$ref'"
          } else {
            $now = (Get-Date).ToUniversalTime()
            $quarter = [int][Math]::Ceiling($now.Month / 3.0)
            $v = "$($now.Year).$quarter.$run.0"
            $src = "date $($now.ToString('yyyy-MM-dd')) (ref '$ref' not sow/yyyy-Qx)"
          }
          Write-Host "SAMVersion = $v (from $src)"
          "samversion=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          # Also expose as env var so msbuild picks it up as a property for ALL subsequent
          # steps without having to thread /p:SAMVersion=... through each invocation.
          "SAMVersion=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # Compute source revision (short SAM_Deploy commit SHA — captures all submodule
          # pointers via gitlinks, so it's the content fingerprint of THIS exact installer).
          # Exposed two ways:
          # - InformationalVersion env var: SDK projects with GenerateAssemblyInfo=true pick this
          #   up automatically and stamp AssemblyInformationalVersionAttribute → visible as
          #   'Product version' in Windows Properties → Details.
          # - SAMSourceRevision env var: available if Directory.Build.props is updated to
          #   compose it explicitly (covers GenerateAssemblyInfo=false projects too).
          $sha = (& git rev-parse --short HEAD 2>$null).Trim()
          if (-not $sha) { $sha = 'unknown' }
          $infoVer = "$v+$sha"
          Write-Host "InformationalVersion = $infoVer"
          "InformationalVersion=$infoVer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SAMSourceRevision=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "informationalversion=$infoVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # -----------------------------------------------------------------------
      # OCCT NATIVE ENGINE
      # SAM_OCCT's managed assemblies + Grasshopper components are built by
      # BuildAll (they post-build into %APPDATA%\SAM like every other module).
      # The native engine (SAM.Occt.Native.dll + the OpenCASCADE TK*.dll runtime)
      # is C++ and is NOT produced by the .sln, so we build it here against a
      # PREBUILT OCCT 8.0 SDK (no multi-hour vcpkg-from-source build) and drop the
      # result into %APPDATA%\SAM so "Stage payload" packages it automatically.
      #
      # The SDK is fetched from a GitHub Release asset (a zip of the official
      # OpenCASCADE 8.0.0 vc14 64-bit package; OCCT is LGPL, so the runtime DLLs
      # are redistributable). By default it is pulled from the OCCT_SDK_REPO repo
      # (private) at tag OCCT_SDK_TAG, asset OCCT_SDK_ASSET, authenticated with the
      # SUBMODULES_PAT the workflow already uses. Override any of those with repo
      # variables, or set the OCCT_SDK_URL secret to download from a presigned URL
      # instead. If NONE of those is available the step SKIPS with a warning and
      # the installer still ships everything else — but SAM.Occt.Native.dll is
      # absent, so OCCT operations take the missing-native path
      # (NativeAvailable == false / SAM_OCCT_NATIVE_MISSING) until the engine is
      # present.
      # -----------------------------------------------------------------------
      - name: Cache OpenCASCADE SDK
        uses: actions/cache@v4
        with:
          path: C:\OCCT
          key: occt-sdk-8.0.0-vc14-64

      - name: Build OCCT native engine (prebuilt OCCT SDK)
        shell: pwsh
        env:
          OCCT_SDK_URL: ${{ secrets.OCCT_SDK_URL }}
          OCCT_SDK_REPO: ${{ vars.OCCT_SDK_REPO || 'SAM-BIM/SAM_OCCT' }}
          OCCT_SDK_TAG: ${{ vars.OCCT_SDK_TAG || 'occt-sdk-8.0.0-vc14-64' }}
          OCCT_SDK_ASSET: ${{ vars.OCCT_SDK_ASSET || 'opencascade-8.0.0-vc14-64-combined.zip' }}
          GH_TOKEN: ${{ secrets.SUBMODULES_PAT }}
        run: |
          $ErrorActionPreference = 'Stop'

          $repo   = Join-Path (Get-Location) 'SAM_OCCT'
          if (-not (Test-Path $repo)) {
            Write-Host "::warning::SAM_OCCT submodule not present; skipping native engine build."
            return
          }

          $sdkRoot = 'C:\OCCT'
          $incProbe = Get-ChildItem -Path $sdkRoot -Recurse -Filter 'gp_Pnt.hxx' -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $incProbe) {
            $zip = Join-Path $env:RUNNER_TEMP 'occt-sdk.zip'
            New-Item -ItemType Directory -Force -Path $sdkRoot | Out-Null

            if (-not [string]::IsNullOrWhiteSpace($env:OCCT_SDK_URL)) {
              Write-Host "Downloading OpenCASCADE SDK from OCCT_SDK_URL ..."
              Invoke-WebRequest -Uri $env:OCCT_SDK_URL -OutFile $zip
            }
            elseif (-not [string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
              Write-Host "Downloading OpenCASCADE SDK release asset '$($env:OCCT_SDK_ASSET)' from $($env:OCCT_SDK_REPO)@$($env:OCCT_SDK_TAG) ..."
              & gh release download $env:OCCT_SDK_TAG --repo $env:OCCT_SDK_REPO --pattern $env:OCCT_SDK_ASSET --output $zip --clobber
              if ($LASTEXITCODE -ne 0) { throw "gh release download failed (check the release tag/asset name and that SUBMODULES_PAT can read $($env:OCCT_SDK_REPO))." }
            }
            else {
              Write-Host "::warning::No OCCT SDK found at $sdkRoot, no OCCT_SDK_URL secret, and no SUBMODULES_PAT to fetch the release asset."
              Write-Host "::warning::Skipping native OCCT engine build. SAM_OCCT managed assemblies/Grasshopper nodes still ship, but the native engine (SAM.Occt.Native.dll + TK*.dll) will be absent."
              return
            }

            Write-Host "Extracting SDK to $sdkRoot ..."
            Expand-Archive -Path $zip -DestinationPath $sdkRoot -Force
            Remove-Item $zip -Force
            $incProbe = Get-ChildItem -Path $sdkRoot -Recurse -Filter 'gp_Pnt.hxx' -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $incProbe) { throw "OCCT SDK downloaded but gp_Pnt.hxx not found under $sdkRoot — check the zip layout." }
          }

          # Discover SDK layout (robust to the exact folder name in the zip).
          $incDir = $incProbe.Directory.FullName
          $libProbe = Get-ChildItem -Path $sdkRoot -Recurse -Filter 'TKernel.lib' -ErrorAction SilentlyContinue | Select-Object -First 1
          $binProbe = Get-ChildItem -Path $sdkRoot -Recurse -Filter 'TKernel.dll' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $libProbe) { throw "TKernel.lib not found under $sdkRoot." }
          if (-not $binProbe) { throw "TKernel.dll not found under $sdkRoot." }
          $libDir = $libProbe.Directory.FullName
          $binDir = $binProbe.Directory.FullName
          Write-Host "OCCT inc: $incDir"
          Write-Host "OCCT lib: $libDir"
          Write-Host "OCCT bin: $binDir"

          $nativeSrc = Join-Path $repo 'native\SAM.Occt.Native'
          $nativeBld = Join-Path $repo 'native\build\x64-windows'
          $outDir    = Join-Path $repo 'build'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          # Configure + build the thin wrapper directly with CMake (no vcpkg
          # toolchain → no manifest-mode OpenCASCADE-from-source build).
          & cmake -S $nativeSrc -B $nativeBld -G "Visual Studio 17 2022" -A x64 `
            "-DSAM_OCCT_OUTPUT_DIRECTORY=$outDir" `
            "-DSAM_OCCT_OCCT_INCLUDE_DIR=$incDir" `
            "-DSAM_OCCT_OCCT_LIBRARY_DIR=$libDir"
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed." }

          & cmake --build $nativeBld --config Release
          if ($LASTEXITCODE -ne 0) { throw "Native build failed." }

          if (-not (Test-Path (Join-Path $outDir 'SAM.Occt.Native.dll'))) {
            throw "SAM.Occt.Native.dll was not produced in $outDir."
          }

          # Copy the OCCT toolkits (TK*.dll) next to the wrapper.
          Get-ChildItem -Path $binDir -Filter '*.dll' | Copy-Item -Destination $outDir -Force

          # Ship only the third-party DLLs the engine actually needs, not the SDK's
          # whole 3rdparty tree. That tree is ~340 DLLs (VTK, Qt, Tcl/Tk, ffmpeg, ...)
          # for OCCT's Draw/Inspector GUI tools, which SAM.Occt.Native never loads;
          # the real runtime closure is just FreeType / FreeImage / TBB / VC runtime.
          # Resolve it precisely with dumpbin: BFS the (regular + delay-load) import
          # closure from the wrapper + TK toolkits and copy each dependency found in
          # the SDK; unresolved names are OS/system DLLs and are skipped.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = $null
          if (Test-Path $vswhere) {
            $dumpbin = & $vswhere -latest -products * -find '**\dumpbin.exe' 2>$null | Select-Object -First 1
          }

          # Index every DLL in the SDK by name (first hit wins; bin/ holds release).
          $sdkIndex = @{}
          Get-ChildItem -Path $sdkRoot -Recurse -Filter '*.dll' -ErrorAction SilentlyContinue | ForEach-Object {
            $k = $_.Name.ToLowerInvariant()
            if (-not $sdkIndex.ContainsKey($k)) { $sdkIndex[$k] = $_.FullName }
          }

          if ($dumpbin -and (Test-Path $dumpbin)) {
            $seen = @{}
            $queue = New-Object System.Collections.Queue
            Get-ChildItem -Path $outDir -Filter '*.dll' | ForEach-Object {
              $seen[$_.Name.ToLowerInvariant()] = $true; $queue.Enqueue($_.FullName)
            }
            while ($queue.Count -gt 0) {
              $cur = $queue.Dequeue()
              $out = (& $dumpbin /nologo /dependents $cur 2>$null) -join "`n"
              foreach ($m in [regex]::Matches($out, '(?im)^\s+([A-Za-z0-9_.+-]+\.dll)\s*$')) {
                $dep = $m.Groups[1].Value.ToLowerInvariant()
                if ($seen.ContainsKey($dep)) { continue }
                $seen[$dep] = $true
                if ($sdkIndex.ContainsKey($dep)) {          # in SDK -> real dep, ship it
                  Copy-Item -LiteralPath $sdkIndex[$dep] -Destination $outDir -Force
                  $queue.Enqueue($sdkIndex[$dep])
                }                                            # else -> system/OS DLL, skip
              }
            }
          }
          else {
            Write-Host "::warning::dumpbin not found; falling back to an explicit third-party allowlist (freetype/FreeImage/tbb/VC runtime)."
            Get-ChildItem -Path $sdkRoot -Recurse -Filter '*.dll' -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '(?i)3rdparty' -and
                             $_.Name -match '(?i)^(freetype|FreeImage|FreeImagePlus|tbb12|tbbmalloc|tbbmalloc_proxy|msvcp140|vcruntime140|concrt140|vccorlib140)' -and
                             $_.Name -notmatch '(?i)(_debug|d)\.dll$' } |
              Copy-Item -Destination $outDir -Force
          }

          # Deploy into the curated payload that "Stage payload" packages.
          $samDir = Join-Path $env:APPDATA 'SAM'
          New-Item -ItemType Directory -Force -Path $samDir | Out-Null
          Get-ChildItem -Path $outDir -Filter '*.dll' | Copy-Item -Destination $samDir -Force

          # Bundle licence/notice files only for the third-party packages that
          # actually contributed a shipped DLL (so notices match the payload, with
          # no Qt/VTK/etc. noise). OCCT's own LGPL texts are committed under
          # SAM_Installer\licenses\OCCT.
          $licDest = Join-Path $samDir 'licenses\3rdparty'
          $shipped = Get-ChildItem -Path $outDir -Filter '*.dll' | ForEach-Object { $_.Name.ToLowerInvariant() }
          $pkgDirs = @{}
          foreach ($n in $shipped) {
            if (-not $sdkIndex.ContainsKey($n)) { continue }
            $p = $sdkIndex[$n]
            $i = $p.IndexOf('3rdparty', [System.StringComparison]::OrdinalIgnoreCase)
            if ($i -lt 0) { continue }                       # OCCT TK*.dll, not 3rdparty
            $parts = $p.Substring($i) -split '[\\/]'          # 3rdpartyRoot \ pkg \ ...
            if ($parts.Count -lt 2) { continue }
            $pkgRel = $parts[0] + '\' + $parts[1]
            $pkgDirs[$pkgRel] = $p.Substring(0, $i) + $pkgRel
          }
          $licCount = 0
          foreach ($pkgRel in $pkgDirs.Keys) {
            Get-ChildItem -Path $pkgDirs[$pkgRel] -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '(?i)(^license|^copying|^lgpl|license\.terms|^\.license|^license-)' -and
                             $_.Extension -notin @('.h','.hpp','.cmake','.cpp','.c','.py','.prl','.dll','.lib') } |
              ForEach-Object {
                $dst = Join-Path (Join-Path $licDest $pkgRel) $_.Name
                New-Item -ItemType Directory -Force -Path (Split-Path -Parent $dst) | Out-Null
                Copy-Item -LiteralPath $_.FullName -Destination $dst -Force
                $licCount++
              }
          }
          if ($pkgDirs.Count -gt 0 -and $licCount -eq 0) { Write-Host "::warning::Shipped third-party DLLs but found no licence files for them — verify notices." }

          $tkCount = (Get-ChildItem -Path $outDir -Filter 'TK*.dll' | Measure-Object).Count
          $tpCount = (Get-ChildItem -Path $outDir -Filter '*.dll' | Measure-Object).Count - $tkCount
          Write-Host "OCCT native engine deployed: SAM.Occt.Native.dll + $tkCount TK*.dll + $tpCount third-party DLLs ($($pkgDirs.Count) pkgs, $licCount licence files) into $samDir"

      - name: Restore (single node)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild `
            '.\BuildAll_Release_net.csproj' `
            '/t:Restore' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release' `
            '/p:UseSharedCompilation=false'

      - name: Rebuild (single node)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild `
            '.\BuildAll_Release_net.csproj' `
            '/t:Rebuild' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release' `
            '/p:UseSharedCompilation=false'

      - name: Restore SAM_UI
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $sln = 'SAM_UI\SAM_UI.sln'
          if (-not (Test-Path $sln)) {
            Write-Host "WARN: $sln not found; skipping SAM_UI restore."
            return
          }

          msbuild `
            $sln `
            '/t:Restore' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release' `
            '/p:UseSharedCompilation=false'

      - name: Rebuild SAM_UI (with post-build)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $sln = 'SAM_UI\SAM_UI.sln'
          if (-not (Test-Path $sln)) {
            Write-Host "WARN: $sln not found; skipping SAM_UI rebuild."
            return
          }

          msbuild `
            $sln `
            '/t:Rebuild' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release' `
            '/p:UseSharedCompilation=false' `
            '/p:RunPostBuildEvent=OnOutputUpdated'

      - name: Restore SAM_Rhino_UI
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $sln = 'SAM_Rhino_UI\SAM_Rhino_UI.sln'
          if (-not (Test-Path $sln)) {
            Write-Host "WARN: $sln not found; skipping SAM_Rhino_UI restore."
            return
          }

          msbuild `
            $sln `
            '/t:Restore' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release' `
            '/p:UseSharedCompilation=false'

      - name: Restore SAM_Revit_UI 2025
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $sln = 'SAM_Revit_UI\SAM_Revit_UI.sln'
          if (-not (Test-Path $sln)) {
            Write-Host "WARN: $sln not found; skipping SAM_Revit_UI restore."
            return
          }

          msbuild `
            $sln `
            '/t:Restore' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release2025' `
            '/p:UseSharedCompilation=false'

      - name: Restore SAM_Revit_UI 2026
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $sln = 'SAM_Revit_UI\SAM_Revit_UI.sln'
          if (-not (Test-Path $sln)) {
            Write-Host "WARN: $sln not found; skipping SAM_Revit_UI restore."
            return
          }

          msbuild `
            $sln `
            '/t:Restore' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release2026' `
            '/p:UseSharedCompilation=false'

      - name: Rebuild SAM_Rhino_UI (with post-build)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $sln = 'SAM_Rhino_UI\SAM_Rhino_UI.sln'
          if (-not (Test-Path $sln)) {
            Write-Host "WARN: $sln not found; skipping SAM_Rhino_UI rebuild."
            return
          }

          msbuild `
            $sln `
            '/t:Rebuild' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release' `
            '/p:UseSharedCompilation=false' `
            '/p:RunPostBuildEvent=OnOutputUpdated'

      - name: Rebuild SAM_Revit_UI 2025 (with post-build)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $sln = 'SAM_Revit_UI\SAM_Revit_UI.sln'
          if (-not (Test-Path $sln)) {
            Write-Host "WARN: $sln not found; skipping SAM_Revit_UI rebuild."
            return
          }

          msbuild `
            $sln `
            '/t:Rebuild' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release2025' `
            '/p:UseSharedCompilation=false' `
            '/p:RunPostBuildEvent=OnOutputUpdated'

      - name: Rebuild SAM_Revit_UI 2026 (with post-build)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $sln = 'SAM_Revit_UI\SAM_Revit_UI.sln'
          if (-not (Test-Path $sln)) {
            Write-Host "WARN: $sln not found; skipping SAM_Revit_UI rebuild."
            return
          }

          msbuild `
            $sln `
            '/t:Rebuild' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release2026' `
            '/p:UseSharedCompilation=false' `
            '/p:RunPostBuildEvent=OnOutputUpdated'

      # -----------------------------------------------------------------------
      # STAGING: build a curated payload that matches the older working pipeline
      # -----------------------------------------------------------------------
      - name: Stage payload for installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $root   = (Get-Location).Path
          $issDir = Join-Path $root 'SAM_Installer'
          $stage  = Join-Path $issDir 'build'
          $samStage = Join-Path $stage 'SAM'
          $samAppData = Join-Path $env:APPDATA 'SAM'

          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path $samStage | Out-Null

          function Copy-IfExists([string]$src,[string]$dest) {
            if (Test-Path $src) {
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
              Copy-Item "$src\*" $dest -Recurse -Force
            }
            else {
              Write-Host "WARN: $src not found (skipped)"
            }
          }

          # Keep special payloads separate / restore old pipeline behaviour
          Copy-IfExists (Join-Path $root 'Install')              $stage
          Copy-IfExists (Join-Path $root 'SAM_Windows\build')   (Join-Path $stage 'SAMdependencies')
          Copy-IfExists (Join-Path $root 'SAM_Revit\references') (Join-Path $stage 'Rhino.Inside')

          # Prefer the curated runtime payload produced by the build itself
          if (-not (Test-Path $samAppData)) {
            throw "Expected curated runtime payload at $samAppData, but it was not created by the build. Refusing to package a guessed mixed payload."
          }
          Copy-IfExists $samAppData $samStage

          # Force correct .NET 8 WindowsDesktop runtime files for standalone SAM_UI apps.
          # The installed payload may already contain older copies from mixed module outputs;
          # always overwrite them with the runtime version that matches the built apps.
          $desktopSharedRoot = Join-Path ${env:ProgramFiles} 'dotnet\shared\Microsoft.WindowsDesktop.App'
          if (-not (Test-Path $desktopSharedRoot)) {
            throw "Microsoft.WindowsDesktop.App shared runtime not found at $desktopSharedRoot"
          }

          $desktopRuntimeDir = Get-ChildItem -Path $desktopSharedRoot -Directory -ErrorAction Stop |
            Where-Object { $_.Name -match '^8\.0\.' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1

          if (-not $desktopRuntimeDir) {
            throw "No Microsoft.WindowsDesktop.App 8.0.x runtime found under $desktopSharedRoot"
          }

          Write-Host "Using WindowsDesktop runtime from: $($desktopRuntimeDir.FullName)"

          $desktopRuntimeFiles = @(
            'System.Drawing.Common.dll',
            'Microsoft.Win32.SystemEvents.dll'
          )

          foreach ($name in $desktopRuntimeFiles) {
            $srcFile = Join-Path $desktopRuntimeDir.FullName $name
            if (-not (Test-Path $srcFile)) {
              throw "Required runtime file not found: $srcFile"
            }
            Copy-Item $srcFile (Join-Path $samStage $name) -Force
            Write-Host "Pinned runtime file: $name"
          }

          # Force SAM_UI-managed dependency versions that must not drift to older shared copies.
          # These files are required by standalone UI and UI launched from Grasshopper.
          $preferredUiRuntimeFiles = @(
            'System.Memory.dll',
            'System.Numerics.Vectors.dll'
          )

          $uiBuildDir = Join-Path $root 'SAM_UI\build'
          if (-not (Test-Path $uiBuildDir)) {
            throw "Required SAM_UI build output folder not found: $uiBuildDir"
          }

          foreach ($name in $preferredUiRuntimeFiles) {
            $srcFile = Join-Path $uiBuildDir $name
            if (-not (Test-Path $srcFile)) {
              throw "Required SAM UI dependency not found in SAM_UI\build: $name"
            }

            $stageFile = Join-Path $samStage $name
            Copy-Item $srcFile $stageFile -Force

            $uiBuildVer = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($srcFile).FileVersion
            $stageVer = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($stageFile).FileVersion

            Write-Host ("Pinned SAM UI dependency: {0} from {1}" -f $name, $srcFile)
            Write-Host ("SAM_UI\build version for {0}: {1}" -f $name, $uiBuildVer)
            Write-Host ("Final staged version for {0}: {1}" -f $name, $stageVer)
          }

          # User files / Grasshopper user objects
          Copy-IfExists (Join-Path $env:USERPROFILE 'Documents\SAM') (Join-Path $stage 'user\Documents\SAM')
          Copy-IfExists (Join-Path $env:APPDATA 'Grasshopper\UserObjects\SAM') (Join-Path $stage 'user\Documents\SAM\Grasshopper\UserObjects')
          Copy-IfExists (Join-Path $env:APPDATA 'Grasshopper\UserObjects\SAM') (Join-Path $stage 'SAMdependencies\GHUserObjects\SAM')

          # Revit add-in template must sit in SAM root for installer code
          $addinTemplate = Join-Path $root 'SAM_Revit_UI\files\Addin\SAM.addin'
          if (Test-Path $addinTemplate) {
            Copy-Item $addinTemplate $samStage -Force
          } else {
            Write-Host "WARN: Revit add-in template not found at $addinTemplate"
          }

          # Overlay Revit-specific outputs only. Do NOT seed year folders with all root DLLs.
          $revitYears = @('2025','2026','2027')
          $revitRoots = @(
            (Join-Path $root 'SAM_Revit'),
            (Join-Path $root 'SAM_Revit_UI')
          )
          $revitNameRegex = '^SAM\..*Revit.*\.(dll|pdb|xml|config|json)$'
          $best = @{}
          foreach ($year in $revitYears) { $best[$year] = @{} }

          foreach ($rr in $revitRoots) {
            if (-not (Test-Path $rr)) { continue }

            Get-ChildItem -Path $rr -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -match $revitNameRegex -and
                $_.FullName -notmatch '\\obj\\' -and
                $_.FullName -notmatch '\\ref\\' -and
                $_.FullName -notmatch '\\packages\\'
              } | ForEach-Object {
                $f = $_
                $targets = @()
                if ($f.FullName -match '2025') { $targets += '2025' }
                if ($f.FullName -match '2026') { $targets += '2026' }
                if ($f.FullName -match '2027') { $targets += '2027' }
                if ($targets.Count -eq 0) { $targets = $revitYears }

                $w = 0
                if ($f.FullName -match '\\build\\') { $w = 2 }
                elseif ($f.FullName -match '\\bin\\') { $w = 1 }

                foreach ($year in $targets) {
                  $existing = $best[$year][$f.Name]
                  if (-not $existing -or
                      $w -gt $existing.Weight -or
                      ($w -eq $existing.Weight -and $f.LastWriteTime -gt $existing.File.LastWriteTime)) {
                    $best[$year][$f.Name] = [pscustomobject]@{ Weight = $w; File = $f }
                  }
                }
              }
          }

          foreach ($year in $revitYears) {
            $targetDir = Join-Path $samStage ("Revit $year")
            New-Item -ItemType Directory -Force -Path $targetDir | Out-Null

            foreach ($kvp in $best[$year].GetEnumerator()) {
              Copy-Item $kvp.Value.File.FullName (Join-Path $targetDir $kvp.Key) -Force
            }

            # Explicitly overlay SAM_Revit_UI shared build output. This is where
            # SAM.Revit.UI.dll and SAM.Core.Revit.UI.dll are expected to come from.
            Copy-IfExists (Join-Path $root 'SAM_Revit_UI\build') $targetDir

            Get-ChildItem -Path $targetDir -File -Filter *.dll -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match 'Grasshopper' } |
              ForEach-Object {
                $gha = [IO.Path]::ChangeExtension($_.FullName, '.gha')
                Copy-Item $_.FullName $gha -Force
              }

            # Safety: if we staged any Revit payload for this year, ensure the add-in loader exists.
            $hasRevitDlls = (Get-ChildItem -Path $targetDir -File -Filter 'SAM.*Revit*.dll' -ErrorAction SilentlyContinue | Measure-Object).Count -gt 0
            $loader = Join-Path $targetDir 'SAM.Revit.UI.dll'
            if ($hasRevitDlls -and -not (Test-Path $loader)) {
              throw "Revit $year payload is missing SAM.Revit.UI.dll in $targetDir"
            }
          }

          # Root Grasshopper DLLs -> GHA
          Get-ChildItem -Path $samStage -File -Filter *.dll -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match '^SAM\..*Grasshopper.*\.dll$' -and
              $_.DirectoryName -notmatch '\\Revit\s20[0-9]{2}$'
            } |
            ForEach-Object {
              $gha = [IO.Path]::ChangeExtension($_.FullName, '.gha')
              Copy-Item $_.FullName $gha -Force
            }

          # Remove host-provided / conflicting DLLs from staged SAM payload.
          # This mirrors the older Hoare Lea pipeline and avoids packaging host assemblies.
          $deleteNames = @(
            'Eto.dll',
            'GH_IO.dll',
            'Grasshopper.dll',
            'RevitAPIIFC.dll',
            'Rhino.UI.dll',
            'RhinoCommon.dll',
            'RevitNodes.dll',
            'RevitServices.dll',
            'RhinoInside.Revit.dll',
            'RhinoInside.Revit.GH.dll'
          )

          foreach ($name in $deleteNames) {
            Get-ChildItem -Path $samStage -Recurse -File -Filter $name -ErrorAction SilentlyContinue |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }

          # Safety: keep only Grasshopper GHAs
          Get-ChildItem -Path $samStage -Recurse -File -Filter 'SAM*.gha' -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch 'Grasshopper' } |
            Remove-Item -Force -ErrorAction SilentlyContinue

          # Rhino UI Yak-style package -> build\SAM_Rhino_UI\1.0.0\*
          $yakRoot       = Join-Path $stage 'SAM_Rhino_UI'
          $yakVersion    = '1.0.0'
          $yakVersionDir = Join-Path $yakRoot $yakVersion
          New-Item -ItemType Directory -Force -Path $yakVersionDir | Out-Null

          # Makes tagged releases fail if Rhino payload is missing
          $rhinoPackageSource = Join-Path $env:APPDATA 'McNeel\Rhinoceros\packages\7.0\SAM\1.0.0'

          if (-not (Test-Path $rhinoPackageSource)) {
            $msg = "No Rhino output directory found at $rhinoPackageSource"

            # Fail for tagged releases so we never publish an installer without Rhino payload
            if ($env:GITHUB_REF -like 'refs/tags/*') {
              throw $msg
            }

            Write-Warning $msg
          }
          else {
            Write-Host "Staging Rhino payload from $rhinoPackageSource -> $yakVersionDir"
            Copy-Item "$rhinoPackageSource\*" $yakVersionDir -Recurse -Force
          }

          $manifestPath = Join-Path $yakRoot 'manifest.txt'
          Set-Content -Path $manifestPath -Value $yakVersion -Encoding ascii

          $stagedRhinoFiles = @(Get-ChildItem -Path $yakVersionDir -Recurse -File -ErrorAction SilentlyContinue)
          $stagedRhp        = @($stagedRhinoFiles | Where-Object { $_.Extension -ieq '.rhp' })

          if ($stagedRhinoFiles.Count -eq 0) {
            $msg = "Rhino package staging folder is empty: $yakVersionDir"

            if ($env:GITHUB_REF -like 'refs/tags/*') {
              throw $msg
            }

            Write-Warning $msg
          }

          if ($stagedRhp.Count -eq 0) {
            $msg = "No .rhp files staged for Rhino package. Source checked: $rhinoPackageSource"

            if ($env:GITHUB_REF -like 'refs/tags/*') {
              throw $msg
            }

            Write-Warning $msg
          }

          $samFiles = @(Get-ChildItem -Path $samStage -Recurse -File -ErrorAction SilentlyContinue)
          Write-Host "Staged SAM payload files: $($samFiles.Count)"
          $samVerEnv = if ($env:SAMVersion) { $env:SAMVersion } else { '<unset>' }
          $infoVerEnv = if ($env:InformationalVersion) { $env:InformationalVersion } else { '<unset>' }
          Write-Host "Effective SAMVersion env value:          $samVerEnv"
          Write-Host "Effective InformationalVersion env value: $infoVerEnv"
          Write-Host "Top-level staged SAM DLLs (FileVersion + ProductVersion = SHA-tagged content identity):"
          # Explicit column formatting via -f rather than Format-Table -AutoSize, because the
          # CI terminal width auto-detection silently drops right-most columns when the table
          # is wider than the assumed buffer (~120 chars).
          $hdr = '{0,-62} {1,10} {2,-22} {3}' -f 'Name', 'Length', 'FileVersion', 'ProductVersion'
          Write-Host $hdr
          Write-Host ('-' * $hdr.Length)
          Get-ChildItem -Path $samStage -File -Filter *.dll -ErrorAction SilentlyContinue |
            Sort-Object Name |
            ForEach-Object {
              $fi = try { [System.Diagnostics.FileVersionInfo]::GetVersionInfo($_.FullName) } catch { $null }
              $fv = if ($fi) { $fi.FileVersion } else { '<unreadable>' }
              $pv = if ($fi) { $fi.ProductVersion } else { '<unreadable>' }
              Write-Host ('{0,-62} {1,10} {2,-22} {3}' -f $_.Name, $_.Length, $fv, $pv)
            }

          foreach ($year in $revitYears) {
            $targetDir = Join-Path $samStage ("Revit $year")
            $dllCount = (Get-ChildItem -Path $targetDir -File -Filter *.dll -ErrorAction SilentlyContinue | Measure-Object).Count
            $ghaCount = (Get-ChildItem -Path $targetDir -File -Filter *.gha -ErrorAction SilentlyContinue | Measure-Object).Count
            $hasRevitLoader = Test-Path (Join-Path $targetDir 'SAM.Revit.UI.dll')
            Write-Host "Revit $year staged: DLL=$dllCount, GHA=$ghaCount, Loader=$hasRevitLoader"
          }

          # -------------------------------------------------------------------
          # STAGE 2.2 OWNERSHIP POLICY + DIAGNOSTICS
          #
          # Policy:
          # - WindowsDesktop runtime files are pinned from the installed .NET runtime
          # - UI-critical pinned files are owned by SAM_UI\build
          # - reviewed UI-match files are expected to stage to the SAM_UI version
          # - accepted drift is tracked but not treated as a failure
          # - unclassified drift is warning-only by default, with optional strict mode
          # -------------------------------------------------------------------
          function Get-FileVersionSafe([string]$path) {
            if (-not (Test-Path $path)) { return $null }
            try {
              return [System.Diagnostics.FileVersionInfo]::GetVersionInfo($path).FileVersion
            }
            catch {
              return $null
            }
          }

          $uiOwnedPinnedFiles = @(
            'System.Memory.dll',
            'System.Numerics.Vectors.dll'
          )

          $uiOwnedReviewedMatchFiles = @(
            'Microsoft.CSharp.dll',
            'System.Buffers.dll',
            'System.Runtime.CompilerServices.Unsafe.dll'
          )

          $knownAcceptedDriftFiles = @(
            'System.Drawing.Common.dll',
            'System.Drawing.Primitives.dll',
            'System.Data.DataSetExtensions.dll',
            'System.Reflection.Emit.ILGeneration.dll',
            'System.Reflection.Emit.Lightweight.dll'
          )

          Write-Host '--- Stage 2.2 ownership policy summary ---'
          Write-Host ('Pinned UI owner files: ' + ($uiOwnedPinnedFiles -join ', '))
          Write-Host ('Reviewed UI match files: ' + ($uiOwnedReviewedMatchFiles -join ', '))
          Write-Host ('Known accepted drift files: ' + ($knownAcceptedDriftFiles -join ', '))
          Write-Host ("STRICT_UNCLASSIFIED_DRIFT={0}" -f $env:STRICT_UNCLASSIFIED_DRIFT)

          $diagnosticRoots = @(
            [pscustomobject]@{ Name = 'SAM_build';    Path = (Join-Path $root 'SAM\build') },
            [pscustomobject]@{ Name = 'SAM_UI_build'; Path = (Join-Path $root 'SAM_UI\build') },
            [pscustomobject]@{ Name = 'APPDATA_SAM';  Path = $samAppData },
            [pscustomobject]@{ Name = 'STAGED_SAM';   Path = $samStage }
          ) | Where-Object { Test-Path $_.Path }

          $dllIndex = @{}
          foreach ($entry in $diagnosticRoots) {
            Get-ChildItem -Path $entry.Path -File -Filter *.dll -ErrorAction SilentlyContinue | ForEach-Object {
              if (-not $dllIndex.ContainsKey($_.Name)) {
                $dllIndex[$_.Name] = @()
              }

              $dllIndex[$_.Name] += [pscustomobject]@{
                Source  = $entry.Name
                Path    = $_.FullName
                Version = Get-FileVersionSafe $_.FullName
              }
            }
          }

          Write-Host '--- Stage 2.2 DLL version diagnostics ---'
          $reviewedResults = @()
          $unclassifiedDriftResults = @()

          foreach ($name in ($dllIndex.Keys | Sort-Object)) {
            $items = @($dllIndex[$name])
            if ($items.Count -lt 2) { continue }

            $versions = @(
              $items |
                ForEach-Object { if ($_.Version) { $_.Version } else { '<unknown>' } } |
                Sort-Object -Unique
            )

            if ($versions.Count -le 1) { continue }

            $classification = 'UNCLASSIFIED_DRIFT'
            if ($uiOwnedPinnedFiles -contains $name) {
              $classification = 'PINNED_UI_OWNER'
            }
            elseif ($uiOwnedReviewedMatchFiles -contains $name) {
              $classification = 'REVIEWED_UI_MATCH'
            }
            elseif ($knownAcceptedDriftFiles -contains $name) {
              $classification = 'KNOWN_ACCEPTED_DRIFT'
            }

            Write-Host ("DLL version drift detected [{0}]: {1}" -f $classification, $name)
            foreach ($item in ($items | Sort-Object Source)) {
              $ver = if ($item.Version) { $item.Version } else { '<unknown>' }
              Write-Host ("  {0} -> {1}" -f $item.Source, $ver)
            }

            $uiItem = $items | Where-Object { $_.Source -eq 'SAM_UI_build' } | Select-Object -First 1
            $stagedItem = $items | Where-Object { $_.Source -eq 'STAGED_SAM' } | Select-Object -First 1

            if ($classification -eq 'REVIEWED_UI_MATCH') {
              $status = 'INSUFFICIENT_DATA'
              if ($uiItem -and $stagedItem -and $uiItem.Version -and $stagedItem.Version) {
                if ($uiItem.Version -eq $stagedItem.Version) {
                  $status = 'STAGED_MATCHES_UI'
                }
                else {
                  $status = 'STAGED_DIFFERS_FROM_UI'
                }
              }

              $reviewedResults += [pscustomobject]@{
                Name = $name
                UIVersion = if ($uiItem) { $uiItem.Version } else { $null }
                StagedVersion = if ($stagedItem) { $stagedItem.Version } else { $null }
                Status = $status
              }

              if ($uiItem -and $uiItem.Version) {
                Write-Host ("  Reviewed UI match target: SAM_UI_build ({0})" -f $uiItem.Version)
              }
              Write-Host ("  Reviewed UI match status: {0}" -f $status)
            }
            elseif ($classification -eq 'UNCLASSIFIED_DRIFT') {
              $unclassifiedDriftResults += [pscustomobject]@{
                Name = $name
                UIVersion = if ($uiItem) { $uiItem.Version } else { $null }
                StagedVersion = if ($stagedItem) { $stagedItem.Version } else { $null }
              }
              Write-Warning ("UNCLASSIFIED drift detected for {0}. Review ownership before next release." -f $name)
            }
          }

          Write-Host '--- Stage 2.2 reviewed UI match summary ---'
          foreach ($result in ($reviewedResults | Sort-Object Name)) {
            $uiVer = if ($result.UIVersion) { $result.UIVersion } else { '<missing>' }
            $stagedVer = if ($result.StagedVersion) { $result.StagedVersion } else { '<missing>' }
            Write-Host ("REVIEWED {0} | UI={1} | STAGED={2} | STATUS={3}" -f $result.Name, $uiVer, $stagedVer, $result.Status)
          }

          Write-Host '--- Stage 2.2 unclassified drift summary ---'
          if ($unclassifiedDriftResults.Count -eq 0) {
            Write-Host 'No unclassified DLL drift detected.'
          }
          else {
            foreach ($result in ($unclassifiedDriftResults | Sort-Object Name)) {
              $uiVer = if ($result.UIVersion) { $result.UIVersion } else { '<missing>' }
              $stagedVer = if ($result.StagedVersion) { $result.StagedVersion } else { '<missing>' }
              Write-Host ("UNCLASSIFIED {0} | UI={1} | STAGED={2}" -f $result.Name, $uiVer, $stagedVer)
            }

            if ($env:STRICT_UNCLASSIFIED_DRIFT -eq 'true') {
              throw 'Unclassified DLL drift detected and STRICT_UNCLASSIFIED_DRIFT=true.'
            }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Package installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $issDir = Resolve-Path 'SAM_Installer' -ErrorAction Stop
          $iscc   = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found." }

          $outDir = Join-Path $issDir '..\dist'
          if (-not (Test-Path $outDir)) {
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          }

          $raw   = '${{ steps.ver.outputs.version }}'
          if (-not $raw) { $raw = 'v_local' }
          $safe  = ($raw -replace '[^0-9A-Za-z_.-]','_')
          $fname = "SAM_Install_$safe"

          Push-Location $issDir
          try {
            & $iscc "/O$outDir" "/F$fname" "/DVersion=$raw" "/DAppVersion=$raw" "Build_Installer.iss"
            if ($LASTEXITCODE -ne 0) {
              throw "ISCC failed ($LASTEXITCODE)"
            }
          }
          finally {
            Pop-Location
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAM_Install
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: SAM_Install
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name:     ${{ needs.build.outputs.version }}
          files:    ./dist/*.exe

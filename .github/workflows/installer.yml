name: Build & Release SAM-BIM Installer 

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v20251126.1)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.ver.outputs.version }}
    permissions:
      contents: read

    steps:
      - name: Checkout (with private submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: Sync & clean submodules
        shell: pwsh
        run: |
          git submodule sync --recursive
          git submodule foreach --recursive 'git reset --hard'
          git submodule foreach --recursive 'git clean -xfd'

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          if (-not $tag -or -not $tag.StartsWith('v')) {
            $tag = "${{ github.event.inputs.version }}"
          }
          if (-not $tag) {
            $tag = "v$(Get-Date -Format yyyyMMdd).${{ github.run_number }}"
          }
          "version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Version: $tag"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore (single node)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $msbuildArgs = @(
            '.\BuildAll_Release_net.csproj',
            '/t:Restore',
            '/m:1','/nr:false','/v:m',
            '/p:Configuration=Release',
            '/p:UseSharedCompilation=false'
          )
          msbuild @msbuildArgs

      - name: Rebuild (single node)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $solutions = @(
            '.\BuildAll_Release_net.csproj'
          )

          foreach ($sln in $solutions) {
            $msbuildArgs = @(
              $sln,
              '/t:Rebuild',
              '/m:1','/nr:false','/v:m',
              '/p:Configuration=Release',
              '/p:UseSharedCompilation=false'
            )

            msbuild @msbuildArgs
          }

      - name: Rebuild SAM_Rhino_UI (with post-build)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $sln = 'SAM_Rhino_UI\SAM_Rhino_UI.sln'

          if (-not (Test-Path $sln)) {
            Write-Host "WARN: $sln not found; skipping SAM_Rhino_UI rebuild."
            return
          }

          $msbuildArgs = @(
            $sln,
            '/t:Rebuild',
            '/m:1','/nr:false','/v:m',
            '/p:Configuration=Release',
            '/p:UseSharedCompilation=false',
            '/p:RunPostBuildEvent=OnOutputUpdated'
          )

          msbuild @msbuildArgs

      # -----------------------------------------------------------------------
      # STAGING: put everything the Inno script expects under SAM_Installer\build
      # -----------------------------------------------------------------------
      - name: Stage payload for installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $root   = (Get-Location).Path
          $issDir = Join-Path $root 'SAM_Installer'
          $stage  = Join-Path $issDir 'build'

          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          function Copy-IfExists([string]$src,[string]$dest) {
            if (Test-Path $src) {
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
              Copy-Item "$src\*" $dest -Recurse -Force
            }
            else {
              Write-Host "WARN: $src not found (skipped)"
            }
          }

          # ---- Core SAM payload (what ends up in %APPDATA%\SAM) --------------
          Copy-IfExists (Join-Path $root 'SAM_UI\build')          (Join-Path $stage 'SAM')

          # NEW: ensure SAM_Tas ends up in %APPDATA%\SAM (no Revit duplication here)
          Copy-IfExists (Join-Path $root 'SAM_Tas\build')         (Join-Path $stage 'SAM')

          # NEW: ensure SAM.addin template is available under %APPDATA%\SAM
          $addinTemplate = Join-Path $root 'SAM_Revit_UI\files\Addin\SAM.addin'
          if (Test-Path $addinTemplate) {
            New-Item -ItemType Directory -Force -Path (Join-Path $stage 'SAM') | Out-Null
            Copy-Item $addinTemplate (Join-Path $stage 'SAM') -Force
          } else {
            Write-Host "WARN: Revit add-in template not found at $addinTemplate"
          }

          Copy-IfExists (Join-Path $root 'SAM_Windows\build')     (Join-Path $stage 'SAMdependencies')
          Copy-IfExists (Join-Path $root 'SAM_Revit\references')  (Join-Path $stage 'Rhino.Inside')
          Copy-IfExists (Join-Path $root 'Documents\SAM')         (Join-Path $stage 'user\Documents\SAM')

          # ---- Revit payload (per year) -> build\SAM\Revit 20xx\ -------------
          $revitYears = @('2025','2026')
          $revitAssemblies = @(
            'SAM.Core.Revit.UI.dll',
            'SAM.Core.Grasshopper.Revit.dll',
            'SAM.Architectural.Grasshopper.Revit.dll',
            'SAM.Analytical.Grasshopper.Revit.dll'
          )

          Write-Host 'Scanning repository for Revit assemblies.'
          $allDlls = Get-ChildItem -Path $root -Recurse -File -Filter *.dll -ErrorAction SilentlyContinue
          $revitByYear = @{}

          foreach ($dll in $allDlls) {
            if ($revitAssemblies -notcontains $dll.Name) { continue }

            $year = $null
            if ($dll.DirectoryName -match '20[0-9]{2}') {
              $m = [regex]::Match($dll.DirectoryName, '20[0-9]{2}')
              if ($m.Success) { $year = $m.Value }
            }
            if (-not $year) { continue }
            if (-not ($revitYears -contains $year)) { continue }

            if (-not $revitByYear.ContainsKey($year)) {
              $revitByYear[$year] = @{}
            }
            $revitByYear[$year][$dll.Name] = $dll.FullName
          }

          foreach ($year in $revitYears) {
            if (-not $revitByYear.ContainsKey($year)) {
              Write-Host "WARN: no Revit assemblies found for $year; SAM\Revit $year will be empty."
              continue
            }

            $targetDir = Join-Path $stage ("SAM\Revit $year")
            New-Item -ItemType Directory -Force -Path $targetDir | Out-Null

            Write-Host "Staging Revit payload for $year into $targetDir"
            foreach ($asmName in $revitAssemblies) {
              if ($revitByYear[$year].ContainsKey($asmName)) {
                Copy-Item $revitByYear[$year][$asmName] (Join-Path $targetDir $asmName) -Force
              }
              else {
                Write-Host "WARN: $asmName not found for Revit $year"
              }
            }

            # NEW: copy runtime files into Revit year folder (like Rhino package),
            # but DO NOT copy any Grasshopper binaries (prevents duplicate core .gha in Revit folders).
            $coreSamDir = Join-Path $stage 'SAM'
            if (Test-Path $coreSamDir) {
              $runtimeFiles = Get-ChildItem -Path $coreSamDir -File -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Extension -in @('.dll','.xml','.config','.json','.pdb') -and
                  $_.Name -notmatch 'Grasshopper' -and
                  $_.Name -ne 'SAM.addin'
                }

              foreach ($f in $runtimeFiles) {
                Copy-Item $f.FullName (Join-Path $targetDir $f.Name) -Force
              }
            }

            # Convert Revit Grasshopper DLLs in this folder into .gha (Revit-only GHAs live here)
            $ghDlls = Get-ChildItem -Path $targetDir -Filter 'SAM.*Grasshopper*.dll' -ErrorAction SilentlyContinue
            foreach ($dll in $ghDlls) {
              $gha = [IO.Path]::ChangeExtension($dll.FullName, '.gha')
              Copy-Item $dll.FullName $gha -Force
            }
          }

          # ---- Rhino UI Yak-style package -> build\SAM_Rhino_UI\1.0.0\* ------
          $rhinoProjRoot = Join-Path $root 'SAM_Rhino_UI'
          $yakRoot       = Join-Path $stage 'SAM_Rhino_UI'
          $yakVersion    = '1.0.0'
          $yakVersionDir = Join-Path $yakRoot $yakVersion

          New-Item -ItemType Directory -Force -Path $yakVersionDir | Out-Null

          $buildDir = Join-Path $rhinoProjRoot 'build'
          $srcDir = $null

          if (Test-Path $buildDir) {
            $first = Get-ChildItem -Path $buildDir -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($first) {
              $srcDir = $buildDir
            }
          }

          if ($srcDir) {
            Write-Host "Staging Rhino payload from $srcDir -> $yakVersionDir"
            Copy-Item "$srcDir\*" $yakVersionDir -Recurse -Force
          }
          else {
            $samRhinoUiProj = Get-ChildItem -Path $rhinoProjRoot -Recurse -Filter 'SAM.Analytical.Rhino.UI.csproj' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($samRhinoUiProj) {
              Write-Host "SAM_Rhino_UI\build not found; building $($samRhinoUiProj.FullName) -> $yakVersionDir"
              & msbuild $samRhinoUiProj.FullName /t:Rebuild /m:1 /nr:false /v:m `
                /p:Configuration=Release /p:UseSharedCompilation=false `
                /p:RunPostBuildEvent=Never `
                "/p:OutDir=$yakVersionDir\"
              if ($LASTEXITCODE -ne 0) { throw "SAM_Rhino_UI build failed ($LASTEXITCODE)" }
            }
            else {
              Write-Host "WARN: SAM_Rhino_UI project not found; Rhino package will only contain manifest."
            }
          }

          # Yak manifest
          $manifestPath = Join-Path $yakRoot 'manifest.txt'
          Set-Content -Path $manifestPath -Value $yakVersion -Encoding ascii

          # Remove any .gha from the Rhino package (core GHAs stay under %APPDATA%\SAM)
          Get-ChildItem -Path $yakVersionDir -Recurse -Filter *.gha -ErrorAction SilentlyContinue |
            Remove-Item -Force

      # Only create GHAs for *core* SAM dlls in build\SAM\ (non-Revit).
      # Revit-specific GHAs are already created in the step above.
      - name: Create Grasshopper .gha for core SAM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stageRoot = Resolve-Path 'SAM_Installer\build' -ErrorAction Stop
          $samRoot   = Join-Path $stageRoot 'SAM'

          if (-not (Test-Path $samRoot)) {
            Write-Host 'SAM root not found in staging; skipping .gha generation.'
            return
          }

          $dlls = Get-ChildItem -Path $samRoot -Recurse -Filter *.dll -ErrorAction SilentlyContinue |
                  Where-Object {
                    $_.Name -match '^SAM\..*Grasshopper.*\.dll$' -and
                    $_.FullName -notmatch '\\Revit\s20[0-9]{2}\\'
                  }

          $count = 0
          foreach ($dll in $dlls) {
            $gha = [IO.Path]::ChangeExtension($dll.FullName, '.gha')
            Copy-Item $dll.FullName $gha -Force
            $count++
          }
          Write-Host "Core Grasshopper GHA created: $count"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Package installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $issDir = Resolve-Path 'SAM_Installer' -ErrorAction Stop
          $iscc   = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found." }

          $outDir = Join-Path $issDir '..\dist'
          if (-not (Test-Path $outDir)) {
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          }

          $raw   = '${{ steps.ver.outputs.version }}'
          if (-not $raw) { $raw = 'v_local' }
          $safe  = ($raw -replace '[^0-9A-Za-z_.-]','_')
          $fname = "SAM_Install_$safe"

          Push-Location $issDir
          try {
            & $iscc "/O$outDir" "/F$fname" "/DVersion=$raw" "/DAppVersion=$raw" "Build_Installer.iss"
            if ($LASTEXITCODE -ne 0) {
              throw "ISCC failed ($LASTEXITCODE)"
            }
          }
          finally {
            Pop-Location
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAM_Install
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: SAM_Install
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name:     ${{ needs.build.outputs.version }}
          files:    ./dist/*.exe

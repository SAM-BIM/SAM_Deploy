name: Build & Release SAM-BIM Installer 

on:
  push:
    tags: ['v*']   # e.g. v20251126.1
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v20251126.1). If tagging, this is ignored.'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.ver.outputs.version }}
    permissions:
      contents: read

    steps:
      - name: Checkout (with private submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: Sync & clean submodules
        shell: pwsh
        run: |
          git submodule sync --recursive
          git submodule foreach --recursive 'git reset --hard'
          git submodule foreach --recursive 'git clean -xfd'

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          if (-not $tag -or -not $tag.StartsWith('v')) { $tag = "${{ github.event.inputs.version }}" }
          if (-not $tag) { $tag = "v$(Get-Date -Format yyyyMMdd).${{ github.run_number }}" }
          "version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Version: $tag"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore (single node)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $msbuildArgs = @(
            '/t:Restore','/m:1','/nr:false','/v:m',
            '/p:Configuration=Release',
            '/p:UseSharedCompilation=false',
            '/p:RunPostBuildEvent=OnOutputUpdated',
            '/p:PostBuildEvent='
          )
          msbuild .\BuildAll_Release_net.csproj @msbuildArgs

      - name: Rebuild (single node)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $msbuildArgs = @(
            '/t:Rebuild','/m:1','/nr:false','/v:m',
            '/p:Configuration=Release',
            '/p:UseSharedCompilation=false',
            '/p:RunPostBuildEvent=OnOutputUpdated',
            '/p:PostBuildEvent='
          )
          msbuild .\BuildAll_Release_net.csproj @msbuildArgs
          
      - name: Stage payload for installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $root  = (Get-Location).Path
          $issDir = Join-Path $root 'SAM_Installer'
          $stage = Join-Path $issDir 'build'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          function Copy-IfExists([string]$src,[string]$dest) {
            if (Test-Path $src) {
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
              Copy-Item "$src\*" $dest -Recurse -Force
            } else {
              Write-Host "WARN: $src not found (skipped)"
            }
          }

          function New-YakPackageFromBin {
            param(
              [string]$projectRoot,
              [string]$stageRoot,
              [string]$yakVersion = '1.0.0'
            )

            $yakRoot    = Join-Path $stageRoot 'SAM_Rhino_UI'
            $versionDir = Join-Path $yakRoot $yakVersion

            if (Test-Path $yakRoot) { Remove-Item $yakRoot -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $versionDir | Out-Null

            # manifest.txt with a single version line
            Set-Content -Path (Join-Path $yakRoot 'manifest.txt') -Value $yakVersion

            $candidateFiles = @()

            # Prefer any existing build folder if present
            $existingBuild = Join-Path $projectRoot 'build'
            if (Test-Path $existingBuild) {
              $candidateFiles += Get-ChildItem -Path $existingBuild -File -Recurse -ErrorAction SilentlyContinue
            }

            if (-not $candidateFiles) {
              # Fall back to compiled outputs under bin\Release*/Debug*
              $binRoots = Get-ChildItem -Path $projectRoot -Recurse -Directory -ErrorAction SilentlyContinue |
                          Where-Object { $_.FullName -match '\\bin\\(Release|Debug)' }

              foreach ($dir in $binRoots) {
                $candidateFiles += Get-ChildItem -Path $dir.FullName -File -ErrorAction SilentlyContinue
              }
            }

            if (-not $candidateFiles) {
              Write-Host "WARN: No Rhino UI binaries found under $projectRoot; Yak package will be empty."
              return
            }

            foreach ($file in $candidateFiles) {
              # Copy dll / rhp / gha and any supporting files
              $dest = Join-Path $versionDir $file.Name
              Copy-Item $file.FullName $dest -Force
            }

            Write-Host "Rhino Yak payload staged at $versionDir"
          }

          # 1) Core payload
          Copy-IfExists (Join-Path $root 'SAM_UI\build')         (Join-Path $stage 'SAM')
          Copy-IfExists (Join-Path $root 'SAM_Windows\build')    (Join-Path $stage 'SAMdependencies')
          Copy-IfExists (Join-Path $root 'SAM_Revit\references') (Join-Path $stage 'Rhino.Inside')
          Copy-IfExists (Join-Path $root 'Documents\SAM')        (Join-Path $stage 'user\Documents\SAM')

          # 1b) Rhino UI Yak-style package (manifest + 1.0.0 folder)
          $samRhinoRoot = Join-Path $root 'SAM_Rhino_UI'
          if (Test-Path $samRhinoRoot) {
            New-YakPackageFromBin -projectRoot $samRhinoRoot -stageRoot $stage -yakVersion '1.0.0'
          } else {
            Write-Host 'WARN: SAM_Rhino_UI directory not found; Rhino packages will be empty.'
          }

          # 2) Bring in other SAM* repo builds (if they have a \build folder)
          $exclude = @('SAM_UI','SAM_Windows','SAM_Rhino_UI','SAM_Revit','SAM_Revit_UI','SAM_Installer')
          Get-ChildItem -Path $root -Directory | Where-Object {
            $_.Name -like 'SAM*' -and ($exclude -notcontains $_.Name)
          } | ForEach-Object {
            $build = Join-Path $_.FullName 'build'
            if (Test-Path $build) {
              Copy-IfExists $build (Join-Path $stage 'SAM')
            }
          }

          # 3) Revit add-in template (SAM.addin) copied next to SAM payload
          $addin = Join-Path $root 'SAM_Revit_UI\files\Addin\SAM.addin'
          if (Test-Path $addin) {
            $samOut = Join-Path $stage 'SAM'
            New-Item -ItemType Directory -Force -Path $samOut | Out-Null
            Copy-Item $addin $samOut -Force
          } else {
            Write-Host "WARN: Revit add-in template not found at $addin"
          }

          # 4) Convert any SAM.*Grasshopper.*.dll under build root into .gha
          $stageRoot = Resolve-Path 'SAM_Installer\build' -ErrorAction Stop
          $dlls = Get-ChildItem -Path $stageRoot -Recurse -Filter *.dll |
                  Where-Object { $_.Name -match '^SAM\..*Grasshopper.*\.dll$' }
          $count = 0
          foreach ($dll in $dlls) {
            $gha = [IO.Path]::ChangeExtension($dll.FullName, '.gha')
            Copy-Item $dll.FullName $gha -Force
            $count++
          }
          Write-Host "GHA created: $count"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Package installer
        shell: pwsh
        run: |
          $issDir = Resolve-Path 'SAM_Installer' -ErrorAction Stop
          $iscc   = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after install." }

          $outDir  = Join-Path $pwd 'dist'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $ver     = '${{ steps.ver.outputs.version }}'
          $safeTag = $ver -replace '[^0-9A-Za-z_.-]', '_'   # filename-safe
          $outBase = "SAM_Install_${safeTag}_Build_Installer"
          $log     = Join-Path $outDir 'iscc.log'

          Push-Location $issDir
          try {
            & "$iscc" `
              "/O`"$outDir`"" `
              "/F`"$outBase`"" `
              "/DVersion=$ver" `
              "/DAppVersion=$ver" `
              "Build_Installer.iss" 2>&1 | Tee-Object -FilePath $log

            if ($LASTEXITCODE -ne 0) {
              Write-Host "===== iscc.log ====="; Get-Content $log | Write-Host
              throw "ISCC failed ($LASTEXITCODE)"
            }
          }
          finally { Pop-Location }

      - name: Verify installer
        shell: pwsh
        run: |
          $exes = Get-ChildItem dist -Filter 'SAM_Install*.exe'
          if (-not $exes) { throw "Installer did not produce SAM_Install*.exe in dist." }
          $exes | Format-Table Name,Length,LastWriteTime -AutoSize

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAM_Install
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: SAM_Install
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name:     ${{ needs.build.outputs.version }}
          files:    ./dist/*.exe

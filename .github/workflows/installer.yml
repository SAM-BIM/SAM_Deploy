name: Build & Release SAM-BIM Installer 

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v20251126.1)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.ver.outputs.version }}
    permissions:
      contents: read

    steps:
      - name: Checkout (with private submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: Sync & clean submodules
        shell: pwsh
        run: |
          git submodule sync --recursive
          git submodule foreach --recursive 'git reset --hard'
          git submodule foreach --recursive 'git clean -xfd'

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          if (-not $tag -or -not $tag.StartsWith('v')) {
            $tag = "${{ github.event.inputs.version }}"
          }
          if (-not $tag) {
            $tag = "v$(Get-Date -Format yyyyMMdd).${{ github.run_number }}"
          }
          "version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Version: $tag"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore (single node)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $msbuildArgs = @(
            '/t:Restore','/m:1','/nr:false','/v:m',
            '/p:Configuration=Release',
            '/p:UseSharedCompilation=false',
            '/p:RunPostBuildEvent=OnOutputUpdated'
          )
          msbuild .\BuildAll_Release_net.csproj @msbuildArgs

      - name: Rebuild (single node)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $msbuildArgs = @(
            '/t:Rebuild','/m:1','/nr:false','/v:m',
            '/p:Configuration=Release',
            '/p:UseSharedCompilation=false',
            '/p:RunPostBuildEvent=OnOutputUpdated'
          )
          msbuild .\BuildAll_Release_net.csproj @msbuildArgs

      - name: Rebuild SAM_Rhino_UI (with post-build)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $sln = 'SAM_Rhino_UI\SAM_Rhino_UI.sln'

          if (-not (Test-Path $sln)) {
            Write-Host "WARN: $sln not found; skipping SAM_Rhino_UI rebuild."
            return
          }

          $msbuildArgs = @(
            $sln,
            '/t:Rebuild',
            '/m:1','/nr:false','/v:m',
            '/p:Configuration=Release',
            '/p:UseSharedCompilation=false',
            '/p:RunPostBuildEvent=OnOutputUpdated'
          )

          msbuild @msbuildArgs

      # -----------------------------------------------------------------------
      # STAGING: put everything the Inno script expects under SAM_Installer\build
      # -----------------------------------------------------------------------
      - name: Stage payload for installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $root   = (Get-Location).Path
          $issDir = Join-Path $root 'SAM_Installer'
          $stage  = Join-Path $issDir 'build'

          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          function Copy-IfExists([string]$src,[string]$dest) {
            if (Test-Path $src) {
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
              Copy-Item "$src\*" $dest -Recurse -Force
            } else {
              Write-Host "WARN: $src not found (skipped)"
            }
          }

          # ---- Core payload ...
          # (keep your existing core + Revit code here unchanged)

          # ---- Rhino Yak payload -----------------------------------------
          $yakRoot      = Join-Path $stage 'SAM_Rhino_UI'
          $yakVersion   = '1.0.0'
          $yakVersionDir = Join-Path $yakRoot $yakVersion
          $rhinoBuild    = Join-Path $root 'SAM_Rhino_UI\build'

          if (Test-Path $rhinoBuild) {
            if (Test-Path $yakRoot) { Remove-Item $yakRoot -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $yakVersionDir | Out-Null

            Copy-Item "$rhinoBuild\*" $yakVersionDir -Recurse -Force

            Get-ChildItem -Path $yakVersionDir -Recurse -Filter '*.gha' -ErrorAction SilentlyContinue |
              Remove-Item -Force

            Set-Content -Path (Join-Path $yakRoot 'manifest.txt') -Value $yakVersion -Encoding utf8

            Write-Host '--- SAM_Rhino_UI\build on CI ---'
            Get-ChildItem -Path $rhinoBuild -Recurse -File | Select-Object FullName,Length

            $fileCount = (Get-ChildItem -Path $yakVersionDir -Recurse -File | Measure-Object).Count
            Write-Host "Rhino Yak payload: $fileCount files staged from SAM_Rhino_UI\build into $yakVersionDir"
          }
          else {
            Write-Host "WARN: SAM_Rhino_UI\build not found; Rhino package will only contain manifest."
            if (-not (Test-Path $yakRoot)) {
              New-Item -ItemType Directory -Force -Path $yakRoot | Out-Null
            }
            Set-Content -Path (Join-Path $yakRoot 'manifest.txt') -Value $yakVersion -Encoding utf8
          }

      # Only create GHAs for *core* SAM dlls in build\SAM\ (non-Revit).
      # Revit-specific GHAs are already created in the step above.
      - name: Create Grasshopper .gha for core SAM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stageRoot = Resolve-Path 'SAM_Installer\build' -ErrorAction Stop
          $samRoot   = Join-Path $stageRoot 'SAM'

          if (-not (Test-Path $samRoot)) {
            Write-Host 'SAM root not found in staging; skipping .gha generation.'
            return
          }

          $dlls = Get-ChildItem -Path $samRoot -Recurse -Filter *.dll -ErrorAction SilentlyContinue |
                  Where-Object {
                    $_.Name -match '^SAM\..*Grasshopper.*\.dll$' -and
                    $_.FullName -notmatch '\\Revit\s20[0-9]{2}\\'
                  }

          $count = 0
          foreach ($dll in $dlls) {
            $gha = [IO.Path]::ChangeExtension($dll.FullName, '.gha')
            Copy-Item $dll.FullName $gha -Force
            $count++
          }
          Write-Host "Core Grasshopper GHA created: $count"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Package installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $issDir = Resolve-Path 'SAM_Installer' -ErrorAction Stop
          $iscc   = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found." }

          $outDir = Join-Path $issDir '..\dist'
          if (-not (Test-Path $outDir)) {
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          }

          $raw   = '${{ steps.ver.outputs.version }}'
          if (-not $raw) { $raw = 'v_local' }
          $safe  = ($raw -replace '[^0-9A-Za-z_.-]','_')
          $fname = "SAM_Install_$safe"

          Push-Location $issDir
          try {
            & $iscc "/O$outDir" "/F$fname" "/DVersion=$raw" "/DAppVersion=$raw" "Build_Installer.iss"
            if ($LASTEXITCODE -ne 0) {
              throw "ISCC failed ($LASTEXITCODE)"
            }
          }
          finally {
            Pop-Location
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAM_Install
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: SAM_Install
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name:     ${{ needs.build.outputs.version }}
          files:    ./dist/*.exe

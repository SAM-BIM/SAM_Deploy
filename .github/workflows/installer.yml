name: Build & Release SAM-BIM Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v20260331.1)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.ver.outputs.version }}
    permissions:
      contents: read

    steps:
      - name: Checkout (with private submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: Sync & clean submodules
        shell: pwsh
        run: |
          git submodule sync --recursive
          git submodule foreach --recursive 'git reset --hard'
          git submodule foreach --recursive 'git clean -xfd'

      - name: Clean local caches used for packaging
        shell: pwsh
        run: |
          $paths = @(
            (Join-Path $env:APPDATA 'SAM'),
            (Join-Path $env:APPDATA 'McNeel\Rhinoceros\packages\7.0\SAM'),
            (Join-Path $env:APPDATA 'McNeel\Rhinoceros\packages\8.0\SAM'),
            (Join-Path $env:APPDATA 'McNeel\Rhinoceros\packages\9.0\SAM')
          )

          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "Removing stale cache: $p"
              Remove-Item $p -Recurse -Force
            }
          }

      - name: Ensure Grasshopper folders exist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $env:APPDATA 'Grasshopper\Libraries') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $env:APPDATA 'Grasshopper\UserObjects\SAM') | Out-Null

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          if (-not $tag -or -not $tag.StartsWith('v')) {
            $tag = "${{ github.event.inputs.version }}"
          }
          if (-not $tag) {
            $tag = "v$(Get-Date -Format yyyyMMdd).${{ github.run_number }}"
          }
          "version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Version: $tag"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Prepare isolated build snapshot folders
        shell: pwsh
        run: |
          $snapRoot = Join-Path (Get-Location).Path '.ci\payload-snapshots'
          if (Test-Path $snapRoot) {
            Remove-Item $snapRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $snapRoot | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $snapRoot 'revit\2025') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $snapRoot 'revit\2026') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $snapRoot 'revit\2027') | Out-Null

      - name: Restore (single node)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild `
            '.\BuildAll_Release_net.csproj' `
            '/t:Restore' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release' `
            '/p:UseSharedCompilation=false'

      - name: Rebuild (single node)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild `
            '.\BuildAll_Release_net.csproj' `
            '/t:Rebuild' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release' `
            '/p:UseSharedCompilation=false'

      - name: Rebuild SAM_Rhino_UI (with post-build)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $sln = 'SAM_Rhino_UI\SAM_Rhino_UI.sln'
          if (-not (Test-Path $sln)) {
            Write-Host "WARN: $sln not found; skipping SAM_Rhino_UI rebuild."
            return
          }

          msbuild `
            $sln `
            '/t:Rebuild' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release' `
            '/p:UseSharedCompilation=false' `
            '/p:RunPostBuildEvent=OnOutputUpdated'

      - name: Rebuild SAM_Revit_UI 2025 (with post-build)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $sln = 'SAM_Revit_UI\SAM_Revit_UI.sln'
          if (-not (Test-Path $sln)) {
            Write-Host "WARN: $sln not found; skipping SAM_Revit_UI rebuild."
            return
          }

          msbuild `
            $sln `
            '/t:Rebuild' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release2025' `
            '/p:UseSharedCompilation=false' `
            '/p:RunPostBuildEvent=OnOutputUpdated'

      - name: Snapshot Revit 2025 payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:APPDATA 'SAM\Revit 2025'
          $dst = Join-Path (Get-Location).Path '.ci\payload-snapshots\revit\2025'
          if (-not (Test-Path $src)) {
            throw "Expected Revit 2025 payload at $src after build, but it was not found."
          }
          if (Test-Path $dst) {
            Remove-Item $dst -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "$src\*" $dst -Recurse -Force
          Write-Host "Snapshotted Revit 2025 payload from $src"

      - name: Rebuild SAM_Revit_UI 2026 (with post-build)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $sln = 'SAM_Revit_UI\SAM_Revit_UI.sln'
          if (-not (Test-Path $sln)) {
            Write-Host "WARN: $sln not found; skipping SAM_Revit_UI rebuild."
            return
          }

          msbuild `
            $sln `
            '/t:Rebuild' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release2026' `
            '/p:UseSharedCompilation=false' `
            '/p:RunPostBuildEvent=OnOutputUpdated'

      - name: Snapshot Revit 2026 payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:APPDATA 'SAM\Revit 2026'
          $dst = Join-Path (Get-Location).Path '.ci\payload-snapshots\revit\2026'
          if (-not (Test-Path $src)) {
            throw "Expected Revit 2026 payload at $src after build, but it was not found."
          }
          if (Test-Path $dst) {
            Remove-Item $dst -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "$src\*" $dst -Recurse -Force
          Write-Host "Snapshotted Revit 2026 payload from $src"

      - name: Snapshot Revit 2027 payload if present
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:APPDATA 'SAM\Revit 2027'
          $dst = Join-Path (Get-Location).Path '.ci\payload-snapshots\revit\2027'
          if (Test-Path $src) {
            if (Test-Path $dst) {
              Remove-Item $dst -Recurse -Force
            }
            New-Item -ItemType Directory -Force -Path $dst | Out-Null
            Copy-Item "$src\*" $dst -Recurse -Force
            Write-Host "Snapshotted Revit 2027 payload from $src"
          }
          else {
            Write-Warning "Revit 2027 payload not found at $src; staging will leave Revit 2027 empty unless provided by another build step."
          }

      - name: Stage payload for installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $root       = (Get-Location).Path
          $issDir     = Join-Path $root 'SAM_Installer'
          $stage      = Join-Path $issDir 'build'
          $payloads   = Join-Path $stage 'payloads'
          $samStage   = Join-Path $stage 'SAM'
          $samAppData = Join-Path $env:APPDATA 'SAM'
          $snapRoot   = Join-Path $root '.ci\payload-snapshots'

          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $payloadShared = Join-Path $payloads 'shared'
          $payloadUi     = Join-Path $payloads 'ui'
          $payloadRhino  = Join-Path $payloads 'rhino'
          $payloadRevit  = Join-Path $payloads 'revit'

          foreach ($dir in @(
            $payloadShared,
            $payloadUi,
            $payloadRhino,
            (Join-Path $payloadRevit '2025'),
            (Join-Path $payloadRevit '2026'),
            (Join-Path $payloadRevit '2027'),
            $samStage
          )) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
          }

          function Copy-IfExists([string]$src,[string]$dest) {
            if (Test-Path $src) {
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
              Copy-Item "$src\*" $dest -Recurse -Force
            }
            else {
              Write-Host "WARN: $src not found (skipped)"
            }
          }

          function Remove-IfExists([string]$path) {
            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          # Keep special payloads separate / restore old pipeline behaviour
          Copy-IfExists (Join-Path $root 'Install')               $stage
          Copy-IfExists (Join-Path $root 'SAM_Windows\build')    (Join-Path $stage 'SAMdependencies')
          Copy-IfExists (Join-Path $root 'SAM_Revit\references') (Join-Path $stage 'Rhino.Inside')

          if (-not (Test-Path $samAppData)) {
            throw "Expected curated runtime payload at $samAppData, but it was not created by the build. Refusing to package a guessed mixed payload."
          }

          # Shared payload comes from curated APPDATA payload, but excludes Revit year folders.
          Copy-IfExists $samAppData $payloadShared
          foreach ($year in @('2025','2026','2027')) {
            Remove-IfExists (Join-Path $payloadShared ("Revit $year"))
          }

          # UI payload starts from shared payload and then receives pinned .NET desktop files.
          Copy-IfExists $payloadShared $payloadUi

          $desktopSharedRoot = Join-Path ${env:ProgramFiles} 'dotnet\shared\Microsoft.WindowsDesktop.App'
          if (-not (Test-Path $desktopSharedRoot)) {
            throw "Microsoft.WindowsDesktop.App shared runtime not found at $desktopSharedRoot"
          }

          $desktopRuntimeDir = Get-ChildItem -Path $desktopSharedRoot -Directory -ErrorAction Stop |
            Where-Object { $_.Name -match '^8\.0\.' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1

          if (-not $desktopRuntimeDir) {
            throw "No Microsoft.WindowsDesktop.App 8.0.x runtime found under $desktopSharedRoot"
          }

          Write-Host "Using WindowsDesktop runtime from: $($desktopRuntimeDir.FullName)"

          $desktopRuntimeFiles = @(
            'System.Drawing.Common.dll',
            'Microsoft.Win32.SystemEvents.dll'
          )

          foreach ($name in $desktopRuntimeFiles) {
            $srcFile = Join-Path $desktopRuntimeDir.FullName $name
            if (-not (Test-Path $srcFile)) {
              throw "Required runtime file not found: $srcFile"
            }
            Copy-Item $srcFile (Join-Path $payloadUi $name) -Force
            Write-Host "Pinned runtime file: $name"
          }

          # User files / Grasshopper user objects
          Copy-IfExists (Join-Path $env:USERPROFILE 'Documents\SAM') (Join-Path $stage 'user\Documents\SAM')
          Copy-IfExists (Join-Path $env:APPDATA 'Grasshopper\UserObjects\SAM') (Join-Path $stage 'user\Documents\SAM\Grasshopper\UserObjects')
          Copy-IfExists (Join-Path $env:APPDATA 'Grasshopper\UserObjects\SAM') (Join-Path $stage 'SAMdependencies\GHUserObjects\SAM')

          # Revit add-in template must sit in SAM root for installer code
          $addinTemplate = Join-Path $root 'SAM_Revit_UI\files\Addin\SAM.addin'
          if (Test-Path $addinTemplate) {
            Copy-Item $addinTemplate (Join-Path $payloadUi 'SAM.addin') -Force
          }
          else {
            Write-Host "WARN: Revit add-in template not found at $addinTemplate"
          }

          # Stage Revit payloads only from isolated snapshots.
          foreach ($year in @('2025','2026','2027')) {
            $src = Join-Path $snapRoot ("revit\$year")
            $dst = Join-Path $payloadRevit $year
            if (Test-Path $src) {
              Copy-IfExists $src $dst
            }
          }

          foreach ($year in @('2025','2026','2027')) {
            $targetDir = Join-Path $payloadRevit $year

            Get-ChildItem -Path $targetDir -File -Filter *.dll -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match 'Grasshopper' } |
              ForEach-Object {
                $gha = [IO.Path]::ChangeExtension($_.FullName, '.gha')
                Copy-Item $_.FullName $gha -Force
              }

            $hasRevitDlls = (Get-ChildItem -Path $targetDir -File -Filter 'SAM.*Revit*.dll' -ErrorAction SilentlyContinue | Measure-Object).Count -gt 0
            $loader = Join-Path $targetDir 'SAM.Revit.UI.dll'
            if ($hasRevitDlls -and -not (Test-Path $loader)) {
              throw "Revit $year payload is missing SAM.Revit.UI.dll in $targetDir"
            }
          }

          # Remove host-provided / conflicting DLLs from shared/UI payloads only.
          $deleteNames = @(
            'Eto.dll',
            'GH_IO.dll',
            'Grasshopper.dll',
            'RevitAPIIFC.dll',
            'Rhino.UI.dll',
            'RhinoCommon.dll',
            'RevitNodes.dll',
            'RevitServices.dll',
            'RhinoInside.Revit.dll',
            'RhinoInside.Revit.GH.dll'
          )

          foreach ($rootDir in @($payloadShared, $payloadUi)) {
            foreach ($name in $deleteNames) {
              Get-ChildItem -Path $rootDir -Recurse -File -Filter $name -ErrorAction SilentlyContinue |
                Remove-Item -Force -ErrorAction SilentlyContinue
            }
          }

          # Root Grasshopper DLLs -> GHA on UI payload only.
          Get-ChildItem -Path $payloadUi -File -Filter *.dll -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match '^SAM\..*Grasshopper.*\.dll$'
            } |
            ForEach-Object {
              $gha = [IO.Path]::ChangeExtension($_.FullName, '.gha')
              Copy-Item $_.FullName $gha -Force
            }

          Get-ChildItem -Path $payloadUi -Recurse -File -Filter 'SAM*.gha' -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch 'Grasshopper' } |
            Remove-Item -Force -ErrorAction SilentlyContinue

          # Validate payload ownership boundaries.
          foreach ($required in $desktopRuntimeFiles) {
            if (-not (Test-Path (Join-Path $payloadUi $required))) {
              throw "Standalone UI payload is missing required runtime file: $required"
            }
          }

          $forbiddenSharedNames = @(
            'RhinoCommon.dll',
            'Grasshopper.dll',
            'RhinoInside.Revit.dll',
            'RhinoInside.Revit.GH.dll',
            'RevitServices.dll'
          )

          foreach ($name in $forbiddenSharedNames) {
            $found = @(Get-ChildItem -Path $payloadShared -Recurse -File -Filter $name -ErrorAction SilentlyContinue)
            if ($found.Count -gt 0) {
              throw "Forbidden host DLL found in shared payload: $name"
            }
          }

          # Materialize final installer layout without changing install destinations.
          Copy-IfExists $payloadUi $samStage
          foreach ($year in @('2025','2026','2027')) {
            $dst = Join-Path $samStage ("Revit $year")
            New-Item -ItemType Directory -Force -Path $dst | Out-Null
            $src = Join-Path $payloadRevit $year
            Copy-IfExists $src $dst
          }

          # Rhino UI Yak-style package -> build\SAM_Rhino_UI\1.0.0\*
          $yakRoot       = Join-Path $stage 'SAM_Rhino_UI'
          $yakVersion    = '1.0.0'
          $yakVersionDir = Join-Path $yakRoot $yakVersion
          New-Item -ItemType Directory -Force -Path $yakRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $yakVersionDir | Out-Null

          $rhinoPackageSource = Join-Path $env:APPDATA 'McNeel\Rhinoceros\packages\7.0\SAM\1.0.0'

          if (-not (Test-Path $rhinoPackageSource)) {
            $msg = "No Rhino output directory found at $rhinoPackageSource"
            if ($env:GITHUB_REF -like 'refs/tags/*') {
              throw $msg
            }
            Write-Warning $msg
          }
          else {
            Write-Host "Staging Rhino payload from $rhinoPackageSource -> $yakVersionDir"
            Copy-Item "$rhinoPackageSource\*" $yakVersionDir -Recurse -Force
            Copy-IfExists $rhinoPackageSource $payloadRhino
          }

          $manifestPath = Join-Path $yakRoot 'manifest.txt'
          Set-Content -Path $manifestPath -Value $yakVersion -Encoding ascii

          $stagedRhinoFiles = @(Get-ChildItem -Path $yakVersionDir -Recurse -File -ErrorAction SilentlyContinue)
          $stagedRhp        = @($stagedRhinoFiles | Where-Object { $_.Extension -ieq '.rhp' })

          if ($stagedRhinoFiles.Count -eq 0) {
            $msg = "Rhino package staging folder is empty: $yakVersionDir"
            if ($env:GITHUB_REF -like 'refs/tags/*') {
              throw $msg
            }
            Write-Warning $msg
          }

          if ($stagedRhp.Count -eq 0) {
            $msg = "No .rhp files staged for Rhino package. Source checked: $rhinoPackageSource"
            if ($env:GITHUB_REF -like 'refs/tags/*') {
              throw $msg
            }
            Write-Warning $msg
          }

          $samFiles = @(Get-ChildItem -Path $samStage -Recurse -File -ErrorAction SilentlyContinue)
          Write-Host "Staged SAM payload files: $($samFiles.Count)"
          Write-Host "Top-level staged SAM DLLs:"
          Get-ChildItem -Path $samStage -File -Filter *.dll -ErrorAction SilentlyContinue |
            Sort-Object Name |
            Select-Object Name,Length |
            Format-Table -AutoSize

          foreach ($year in @('2025','2026','2027')) {
            $targetDir = Join-Path $samStage ("Revit $year")
            $dllCount = (Get-ChildItem -Path $targetDir -File -Filter *.dll -ErrorAction SilentlyContinue | Measure-Object).Count
            $ghaCount = (Get-ChildItem -Path $targetDir -File -Filter *.gha -ErrorAction SilentlyContinue | Measure-Object).Count
            $hasRevitLoader = Test-Path (Join-Path $targetDir 'SAM.Revit.UI.dll')
            Write-Host "Revit $year staged: DLL=$dllCount, GHA=$ghaCount, Loader=$hasRevitLoader"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Package installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $issDir = Resolve-Path 'SAM_Installer' -ErrorAction Stop
          $iscc   = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found." }

          $outDir = Join-Path $issDir '..\dist'
          if (-not (Test-Path $outDir)) {
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          }

          $raw   = '${{ steps.ver.outputs.version }}'
          if (-not $raw) { $raw = 'v_local' }
          $safe  = ($raw -replace '[^0-9A-Za-z_.-]','_')
          $fname = "SAM_Install_$safe"

          Push-Location $issDir
          try {
            & $iscc "/O$outDir" "/F$fname" "/DVersion=$raw" "/DAppVersion=$raw" "Build_Installer.iss"
            if ($LASTEXITCODE -ne 0) {
              throw "ISCC failed ($LASTEXITCODE)"
            }
          }
          finally {
            Pop-Location
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAM_Install
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: SAM_Install
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name:     ${{ needs.build.outputs.version }}
          files:    ./dist/*.exe

name: Build & Release SAM-BIM Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v20251126.1)'
        required: false
        default: ''
      publish_release:
        description: 'Create GitHub Release on manual run'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.ver.outputs.version }}
    permissions:
      contents: read
      # Required ONLY so a corrupt OCCT cache entry can be deleted before it
      # is re-saved (GitHub cache entries are immutable per key+scope - see
      # the "Cache OpenCASCADE SDK" step below). The delete this job can issue
      # is pinned to the exact OCCT key AND to ${{ github.ref }} - i.e. this
      # run's OWN branch scope. It can never match master's scope or another
      # branch's, so it cannot remove or mask a shared cache entry; repairing
      # the shared master-scoped entry is occt-cache-warm.yml's job (SAM_Deploy
      # PR #28), not this workflow's.
      actions: write
    env:
      STRICT_UNCLASSIFIED_DRIFT: 'false'
      # SAM.Geometry.Grasshopper.OCCT has a BeforeTargets="Build" step that runs
      # build-native.ps1 (vcpkg/OCCT SDK), which fails on the runner. The native
      # engine is built by the dedicated "Build OCCT native engine" step instead,
      # so skip the in-project native build during the managed compile (same flag
      # SAM_OCCT's own build.yml uses).
      SAM_OCCT_SKIP_NATIVE_BUILD: 'true'

    steps:
      - name: Checkout (with private submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: Sync & clean submodules
        shell: pwsh
        run: |
          git submodule sync --recursive
          git submodule foreach --recursive 'git reset --hard'
          git submodule foreach --recursive 'git clean -xfd'

      - name: Clean local caches used for packaging
        shell: pwsh
        run: |
          $paths = @(
            (Join-Path $env:APPDATA 'SAM'),
            (Join-Path $env:APPDATA 'McNeel\Rhinoceros\packages\8.0\SAM'),
            (Join-Path $env:APPDATA 'McNeel\Rhinoceros\packages\9.0\SAM')
          )

          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "Removing stale cache: $p"
              Remove-Item $p -Recurse -Force
            }
          }

      - name: Ensure Grasshopper folders exist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $env:APPDATA 'Grasshopper\Libraries') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $env:APPDATA 'Grasshopper\UserObjects\SAM') | Out-Null

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          if (-not $tag -or -not $tag.StartsWith('v')) {
            $tag = "${{ github.event.inputs.version }}"
          }
          if (-not $tag) {
            $tag = "v$(Get-Date -Format yyyyMMdd).${{ github.run_number }}"
          }

          # Normalise manual version strings so release/tag names stay valid.
          $tag = $tag.Trim()
          $tag = ($tag -replace '\s+','-')
          $tag = ($tag -replace '[^0-9A-Za-z_.-]','-')

          "version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Version: $tag"

      - name: Compute SAMVersion
        id: samver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Prefer head_ref when its a sow branch (release-promotion PRs from sow/* to main),
          # else use base_ref on PR events / ref_name on push/dispatch events.
          $headRef = '${{ github.head_ref }}'
          $baseRef = '${{ github.base_ref }}'
          $refName = '${{ github.ref_name }}'
          if ($headRef -match '^sow/\d{4}-Q\d$') {
            $ref = $headRef
          } elseif ('${{ github.event_name }}' -eq 'pull_request') {
            $ref = $baseRef
          } else {
            $ref = $refName
          }
          # .NET AssemblyVersion components are UInt16 (max 65535). Cap to 60000 for headroom.
          $run = ${{ github.run_number }} % 60000
          if ($ref -match 'sow/(\d{4})-Q(\d)') {
            $v = "$($Matches[1]).$($Matches[2]).$run.0"
            $src = "branch '$ref'"
          } else {
            $now = (Get-Date).ToUniversalTime()
            $quarter = [int][Math]::Ceiling($now.Month / 3.0)
            $v = "$($now.Year).$quarter.$run.0"
            $src = "date $($now.ToString('yyyy-MM-dd')) (ref '$ref' not sow/yyyy-Qx)"
          }
          Write-Host "SAMVersion = $v (from $src)"
          "samversion=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          # Also expose as env var so msbuild picks it up as a property for ALL subsequent
          # steps without having to thread /p:SAMVersion=... through each invocation.
          "SAMVersion=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # Compute source revision (short SAM_Deploy commit SHA — captures all submodule
          # pointers via gitlinks, so it's the content fingerprint of THIS exact installer).
          # Exposed two ways:
          # - InformationalVersion env var: SDK projects with GenerateAssemblyInfo=true pick this
          #   up automatically and stamp AssemblyInformationalVersionAttribute → visible as
          #   'Product version' in Windows Properties → Details.
          # - SAMSourceRevision env var: available if Directory.Build.props is updated to
          #   compose it explicitly (covers GenerateAssemblyInfo=false projects too).
          $sha = (& git rev-parse --short HEAD 2>$null).Trim()
          if (-not $sha) { $sha = 'unknown' }
          $infoVer = "$v+$sha"
          Write-Host "InformationalVersion = $infoVer"
          "InformationalVersion=$infoVer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SAMSourceRevision=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "informationalversion=$infoVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # Revit 2025 and 2026 target net8.0-windows; Revit 2027 targets net10.0-windows
      # (RevitAPI 27.0.4.0 binds System.Runtime 10.0.0.0, so a net8 target fails CS1705).
      # Both SDKs are installed side by side - the 2027 configurations cannot build without
      # the .NET 10 SDK, and everything else still needs 8.
      - name: Setup .NET 8 and .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # -----------------------------------------------------------------------
      # OCCT NATIVE ENGINE
      # SAM_OCCT's managed assemblies + Grasshopper components are built by
      # BuildAll (they post-build into %APPDATA%\SAM like every other module).
      # The native engine (SAM.Occt.Native.dll + the OpenCASCADE TK*.dll runtime)
      # is C++ and is NOT produced by the .sln, so we build it here against a
      # PREBUILT OCCT 8.0 SDK (no multi-hour vcpkg-from-source build) and drop the
      # result into %APPDATA%\SAM so "Stage payload" packages it automatically.
      #
      # The SDK is fetched from a GitHub Release asset (a zip of the official
      # OpenCASCADE 8.0.0 vc14 64-bit package; OCCT is LGPL, so the runtime DLLs
      # are redistributable). By default it is pulled from the OCCT_SDK_REPO repo
      # (private) at tag OCCT_SDK_TAG, asset OCCT_SDK_ASSET, authenticated with the
      # SUBMODULES_PAT the workflow already uses. Override any of those with repo
      # variables, or set the OCCT_SDK_URL secret to download from a presigned URL
      # instead. If NONE of those is available the step SKIPS with a warning and
      # the installer still ships everything else — but SAM.Occt.Native.dll is
      # absent, so OCCT operations take the missing-native path
      # (NativeAvailable == false / SAM_OCCT_NATIVE_MISSING) until the engine is
      # present.
      # -----------------------------------------------------------------------
      # Key = SDK identity (OCCT_SDK_TAG, same var the download step below falls
      # back to) + runner OS + arch + an explicit cache-schema version. No commit
      # SHA, branch name or run number, so the SAME cache is reused by every
      # branch that can read it - see occt-cache-warm.yml (SAM_Deploy PR #28)
      # for why a branch's *first* run can still miss.
      #
      # 'Windows' is spelled out rather than using ${{ runner.os }} so this key
      # and the two copies of it on master (installer.yml + occt-cache-warm.yml)
      # can be compared as literal text by an audit. runs-on is windows-2022,
      # for which runner.os is always exactly 'Windows'.
      #
      # Deliberately NO restore-keys: a prefix fallback that doesn't include the
      # schema token would let a future v1 -> v2 schema bump restore the old v1
      # contents (still marker-complete, so the validation step below accepts
      # it), skip the download meant to invalidate v1, and then save that same
      # stale content back out under the new v2 key - permanently poisoning the
      # new schema with old data. A schema bump must always cold-miss and
      # re-download; the primary key alone (which DOES change on a schema bump)
      # is what makes that happen.
      # RESTORE ONLY (not the combined actions/cache@v4). The combined action
      # registers a post-job save that it SKIPS whenever the primary key hits
      # exactly - so if a restored entry is corrupt, this job could repair
      # C:\OCCT locally and the fix would still never be written back (GitHub
      # cache entries are immutable per key+scope; a save under an existing
      # key is silently declined). Splitting restore from save is what lets
      # the "Build OCCT native engine" step below decide for itself whether a
      # save is needed, and lets it delete a corrupt entry first when one is.
      - name: Cache OpenCASCADE SDK
        id: occt-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\OCCT
          key: ${{ vars.OCCT_SDK_TAG || 'occt-sdk-8.0.0-vc14-64' }}-Windows-x64-v1

      - name: Report OCCT SDK cache status
        shell: pwsh
        run: |
          $hit = '${{ steps.occt-cache.outputs.cache-hit }}'
          if ($hit -eq 'true') {
            Write-Host "OCCT SDK cache: HIT on primary key."
          } else {
            Write-Host "OCCT SDK cache: MISS - no cache restored, next step will download cold."
          }

      - name: Build OCCT native engine (prebuilt OCCT SDK)
        id: occt-build
        shell: pwsh
        env:
          OCCT_SDK_URL: ${{ secrets.OCCT_SDK_URL }}
          OCCT_SDK_REPO: ${{ vars.OCCT_SDK_REPO || 'SAM-BIM/SAM_OCCT' }}
          OCCT_SDK_TAG: ${{ vars.OCCT_SDK_TAG || 'occt-sdk-8.0.0-vc14-64' }}
          OCCT_SDK_ASSET: ${{ vars.OCCT_SDK_ASSET || 'opencascade-8.0.0-vc14-64-combined.zip' }}
          OCCT_SDK_GH_TOKEN: ${{ secrets.SUBMODULES_PAT }}
          OCCT_CACHE_KEY: ${{ steps.occt-cache.outputs.cache-primary-key }}
          OCCT_CACHE_HIT: ${{ steps.occt-cache.outputs.cache-hit }}
          CACHE_ADMIN_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Default: nothing downloaded, nothing to save. Every early exit
          # below must confirm this before returning.
          "sdk-changed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $repo   = Join-Path (Get-Location) 'SAM_OCCT'
          if (-not (Test-Path $repo)) {
            Write-Host "::warning::SAM_OCCT submodule not present; skipping native engine build."
            return
          }

          $sdkRoot = 'C:\OCCT'

          # A restored cache is only trustworthy if all three load-bearing
          # markers are present (a partial/corrupt cache entry, or one from an
          # incompatible SDK layout, must not be silently treated as good).
          function Test-OcctSdk([string]$root) {
            $inc = Get-ChildItem -Path $root -Recurse -Filter 'gp_Pnt.hxx'  -ErrorAction SilentlyContinue | Select-Object -First 1
            $lib = Get-ChildItem -Path $root -Recurse -Filter 'TKernel.lib' -ErrorAction SilentlyContinue | Select-Object -First 1
            $bin = Get-ChildItem -Path $root -Recurse -Filter 'TKernel.dll' -ErrorAction SilentlyContinue | Select-Object -First 1
            [pscustomobject]@{ Valid = [bool]($inc -and $lib -and $bin); Inc = $inc; Lib = $lib; Bin = $bin }
          }

          $probe = Test-OcctSdk $sdkRoot

          if ($probe.Valid) {
            Write-Host "Restored OCCT SDK at $sdkRoot validated (gp_Pnt.hxx, TKernel.lib, TKernel.dll all present) - skipping download, nothing to save."
          }
          else {
            if ($env:OCCT_CACHE_HIT -eq 'true') {
              # The exact key hit but the content is corrupt. GitHub cache
              # entries are immutable per (key, scope): saving under this
              # same key later would silently no-op and the corrupt entry
              # would remain authoritative for this branch's own scope
              # forever. Delete it first - scoped to the exact key AND
              # github.ref (this run's OWN branch), so it can never touch
              # master's scope or another branch's. If the hit came from an
              # INHERITED scope (e.g. master) rather than this branch's own,
              # this delete is a harmless no-op there; repairing a shared
              # inherited entry is occt-cache-warm.yml's job, not this one's
              # - the save below still succeeds in that case because this
              # branch's OWN scope has no entry yet to conflict with it.
              Write-Host "::warning::Restored OCCT SDK at $sdkRoot is INVALID (missing one of gp_Pnt.hxx / TKernel.lib / TKernel.dll) despite an exact cache-key hit. Deleting any entry for key '$($env:OCCT_CACHE_KEY)' in this branch's own scope ($($env:GITHUB_REF)) so a repaired SDK can be saved under the same key."
              $env:GH_TOKEN = $env:CACHE_ADMIN_TOKEN
              & gh cache delete $env:OCCT_CACHE_KEY --ref $env:GITHUB_REF --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) {
                Write-Host "::warning::No cache entry for key '$($env:OCCT_CACHE_KEY)' found in this branch's own scope ($($env:GITHUB_REF)) - the corrupt copy was inherited from another scope (e.g. master) and cannot be repaired from here. Continuing with a local redownload; run 'Warm OCCT SDK cache (default branch)' to repair the shared master-scoped entry."
              }
            }

            if (Test-Path $sdkRoot) {
              Write-Host "Removing incomplete local $sdkRoot before re-downloading."
              Remove-Item $sdkRoot -Recurse -Force
            }

            $zip = Join-Path $env:RUNNER_TEMP 'occt-sdk.zip'
            New-Item -ItemType Directory -Force -Path $sdkRoot | Out-Null

            if (-not [string]::IsNullOrWhiteSpace($env:OCCT_SDK_URL)) {
              Write-Host "Downloading OpenCASCADE SDK from OCCT_SDK_URL ..."
              Invoke-WebRequest -Uri $env:OCCT_SDK_URL -OutFile $zip
            }
            elseif (-not [string]::IsNullOrWhiteSpace($env:OCCT_SDK_GH_TOKEN)) {
              Write-Host "Downloading OpenCASCADE SDK release asset '$($env:OCCT_SDK_ASSET)' from $($env:OCCT_SDK_REPO)@$($env:OCCT_SDK_TAG) ..."
              $env:GH_TOKEN = $env:OCCT_SDK_GH_TOKEN
              & gh release download $env:OCCT_SDK_TAG --repo $env:OCCT_SDK_REPO --pattern $env:OCCT_SDK_ASSET --output $zip --clobber
              if ($LASTEXITCODE -ne 0) { throw "gh release download failed (check the release tag/asset name and that SUBMODULES_PAT can read $($env:OCCT_SDK_REPO))." }
            }
            else {
              Write-Host "::warning::No OCCT SDK found at $sdkRoot, no OCCT_SDK_URL secret, and no SUBMODULES_PAT to fetch the release asset."
              Write-Host "::warning::Skipping native OCCT engine build. SAM_OCCT managed assemblies/Grasshopper nodes still ship, but the native engine (SAM.Occt.Native.dll + TK*.dll) will be absent."
              return
            }

            Write-Host "Extracting SDK to $sdkRoot ..."
            Expand-Archive -Path $zip -DestinationPath $sdkRoot -Force
            Remove-Item $zip -Force
            $probe = Test-OcctSdk $sdkRoot
            if (-not $probe.Valid) { throw "OCCT SDK downloaded but gp_Pnt.hxx/TKernel.lib/TKernel.dll not all found under $sdkRoot — check the zip layout." }

            Write-Host "OCCT SDK downloaded and validated at $sdkRoot - will be saved under key '$($env:OCCT_CACHE_KEY)'."
            "sdk-changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

          # Discover SDK layout (robust to the exact folder name in the zip).
          $incDir = $probe.Inc.Directory.FullName
          $libDir = $probe.Lib.Directory.FullName
          $binDir = $probe.Bin.Directory.FullName
          Write-Host "OCCT inc: $incDir"
          Write-Host "OCCT lib: $libDir"
          Write-Host "OCCT bin: $binDir"

          $nativeSrc = Join-Path $repo 'native\SAM.Occt.Native'
          $nativeBld = Join-Path $repo 'native\build\x64-windows'
          $outDir    = Join-Path $repo 'build'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          # Configure + build the thin wrapper directly with CMake (no vcpkg
          # toolchain → no manifest-mode OpenCASCADE-from-source build).
          & cmake -S $nativeSrc -B $nativeBld -G "Visual Studio 17 2022" -A x64 `
            "-DSAM_OCCT_OUTPUT_DIRECTORY=$outDir" `
            "-DSAM_OCCT_OCCT_INCLUDE_DIR=$incDir" `
            "-DSAM_OCCT_OCCT_LIBRARY_DIR=$libDir"
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed." }

          & cmake --build $nativeBld --config Release
          if ($LASTEXITCODE -ne 0) { throw "Native build failed." }

          if (-not (Test-Path (Join-Path $outDir 'SAM.Occt.Native.dll'))) {
            throw "SAM.Occt.Native.dll was not produced in $outDir."
          }

          # Ship only what the engine actually loads, not the SDK's whole bin +
          # 3rdparty tree. The SDK has 74 TK*.dll and ~340 3rdparty DLLs (VTK, Qt,
          # Tcl/Tk, ffmpeg, ...); most exist for OCCT's Draw/Inspector GUI tools
          # (TKIVtk->VTK, TKDraw->Tcl/Tk, ...) that SAM.Occt.Native never links.
          # Resolve the real runtime closure with dumpbin: BFS the (regular +
          # delay-load) import graph starting ONLY from the wrapper, copying each
          # dependency found in the SDK (TK toolkits + FreeType/FreeImage/TBB/VC
          # runtime). Seeding from the wrapper alone — not from every TK*.dll —
          # keeps the GUI toolkits and their Qt/VTK payload out of the closure.
          # Unresolved names are OS/system DLLs and are skipped.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = $null
          if (Test-Path $vswhere) {
            $dumpbin = & $vswhere -latest -products * -find '**\dumpbin.exe' 2>$null | Select-Object -First 1
          }

          # Index every DLL in the SDK by name (bin/ TK toolkits + 3rdparty; first hit wins).
          $sdkIndex = @{}
          Get-ChildItem -Path $sdkRoot -Recurse -Filter '*.dll' -ErrorAction SilentlyContinue | ForEach-Object {
            $k = $_.Name.ToLowerInvariant()
            if (-not $sdkIndex.ContainsKey($k)) { $sdkIndex[$k] = $_.FullName }
          }

          $usedDumpbin = $false
          if ($dumpbin -and (Test-Path $dumpbin)) {
            $seen = @{}
            $queue = New-Object System.Collections.Queue
            # Seed ONLY from the wrapper (already built into $outDir).
            $seen['sam.occt.native.dll'] = $true
            $queue.Enqueue((Join-Path $outDir 'SAM.Occt.Native.dll'))
            while ($queue.Count -gt 0) {
              $cur = $queue.Dequeue()
              $out = (& $dumpbin /nologo /dependents $cur 2>$null) -join "`n"
              foreach ($m in [regex]::Matches($out, '(?im)^\s+([A-Za-z0-9_.+-]+\.dll)\s*$')) {
                $dep = $m.Groups[1].Value.ToLowerInvariant()
                if ($seen.ContainsKey($dep)) { continue }
                $seen[$dep] = $true
                if ($sdkIndex.ContainsKey($dep)) {          # in SDK -> real dep, ship it
                  Copy-Item -LiteralPath $sdkIndex[$dep] -Destination $outDir -Force
                  $queue.Enqueue($sdkIndex[$dep])
                }                                            # else -> system/OS DLL, skip
              }
            }
            $usedDumpbin = $true
          }

          # Safety net: dumpbin discards stderr and needs the VC environment, so a
          # silent failure would copy zero dependencies and leave the wrapper without
          # its OCCT TK*.dll runtime. If the closure clearly failed (too few TK
          # toolkits resolved) — or dumpbin was absent — fall back to copying ALL TK
          # toolkits + the third-party allowlist so the engine is never shipped broken.
          $tkResolved = (Get-ChildItem -Path $outDir -Filter 'TK*.dll' -ErrorAction SilentlyContinue | Measure-Object).Count
          if (-not $usedDumpbin -or $tkResolved -lt 5) {
            if ($usedDumpbin) { Write-Host "::warning::dumpbin resolved only $tkResolved TK*.dll (closure likely failed); falling back to all TK toolkits + third-party allowlist." }
            else { Write-Host "::warning::dumpbin not found; using all TK toolkits + third-party allowlist (freetype/FreeImage/tbb/VC runtime)." }
            Get-ChildItem -Path $binDir -Filter 'TK*.dll' | Copy-Item -Destination $outDir -Force
            Get-ChildItem -Path $sdkRoot -Recurse -Filter '*.dll' -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '(?i)3rdparty' -and
                             $_.Name -match '(?i)^(freetype|FreeImage|FreeImagePlus|tbb12|tbbmalloc|tbbmalloc_proxy|msvcp140|vcruntime140|concrt140|vccorlib140)' -and
                             $_.Name -notmatch '(?i)(_debug|d)\.dll$' } |
              Copy-Item -Destination $outDir -Force
          }

          # Deploy into the curated payload that "Stage payload" packages.
          $samDir = Join-Path $env:APPDATA 'SAM'
          New-Item -ItemType Directory -Force -Path $samDir | Out-Null
          Get-ChildItem -Path $outDir -Filter '*.dll' | Copy-Item -Destination $samDir -Force

          # Bundle licence/notice files only for the third-party packages that
          # actually contributed a shipped DLL (so notices match the payload, with
          # no Qt/VTK/etc. noise). OCCT's own LGPL texts are committed under
          # SAM_Installer\licenses\OCCT.
          $licDest = Join-Path $samDir 'licenses\3rdparty'
          $shipped = Get-ChildItem -Path $outDir -Filter '*.dll' | ForEach-Object { $_.Name.ToLowerInvariant() }
          $pkgDirs = @{}
          foreach ($n in $shipped) {
            if (-not $sdkIndex.ContainsKey($n)) { continue }
            $p = $sdkIndex[$n]
            $i = $p.IndexOf('3rdparty', [System.StringComparison]::OrdinalIgnoreCase)
            if ($i -lt 0) { continue }                       # OCCT TK*.dll, not 3rdparty
            $parts = $p.Substring($i) -split '[\\/]'          # 3rdpartyRoot \ pkg \ ...
            if ($parts.Count -lt 2) { continue }
            $pkgRel = $parts[0] + '\' + $parts[1]
            $pkgDirs[$pkgRel] = $p.Substring(0, $i) + $pkgRel
          }
          # Per-package, not just a global total: every shipped third-party
          # package must carry at least one notice. If a package has no licence
          # file in the SDK (e.g. the MS VC runtime), write a placeholder pointing
          # to its terms so no shipped DLL lacks a notice, and warn.
          $licCount = 0
          $pkgsNoNotice = @()
          foreach ($pkgRel in $pkgDirs.Keys) {
            $pkgLicFiles = Get-ChildItem -Path $pkgDirs[$pkgRel] -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '(?i)(^license|^copying|^lgpl|license\.terms|^\.license|^license-|^notice)' -and
                             $_.Extension -notin @('.h','.hpp','.cmake','.cpp','.c','.py','.prl','.dll','.lib') }
            $pkgDestDir = Join-Path $licDest $pkgRel
            $pkgN = 0
            foreach ($f in $pkgLicFiles) {
              New-Item -ItemType Directory -Force -Path $pkgDestDir | Out-Null
              Copy-Item -LiteralPath $f.FullName -Destination (Join-Path $pkgDestDir $f.Name) -Force
              $pkgN++; $licCount++
            }
            if ($pkgN -eq 0) {
              $pkgsNoNotice += $pkgRel
              New-Item -ItemType Directory -Force -Path $pkgDestDir | Out-Null
              $stub = Join-Path $pkgDestDir 'THIRD-PARTY-NOTICE.txt'
              @(
                "Third-party component shipped with SAM: $pkgRel"
                ""
                "No licence text accompanied this component in the OpenCASCADE SDK."
                "Its redistribution is governed by that component's own licence:"
                " - Microsoft Visual C++ runtime (msvc-*): the Microsoft Visual Studio / Build Tools redistributable terms."
                " - Otherwise: refer to the upstream project for $pkgRel."
                "Verify the applicable terms before public distribution."
              ) | Set-Content -LiteralPath $stub -Encoding UTF8
              Write-Host "::warning::Third-party package '$pkgRel' shipped a DLL but no licence file was found in the SDK; wrote a placeholder notice. Verify its licensing."
            }
          }
          if ($pkgsNoNotice.Count -gt 0) { Write-Host ("::warning::Packages shipped without an SDK licence file: {0}" -f ($pkgsNoNotice -join ', ')) }

          $tkCount = (Get-ChildItem -Path $outDir -Filter 'TK*.dll' | Measure-Object).Count
          $tpCount = (Get-ChildItem -Path $outDir -Filter '*.dll' | Measure-Object).Count - $tkCount
          Write-Host "OCCT native engine deployed: SAM.Occt.Native.dll + $tkCount TK*.dll + $tpCount third-party DLLs ($($pkgDirs.Count) pkgs, $licCount licence files) into $samDir"

      # Only runs when the step above actually downloaded something new
      # (cold miss, or a corrupt entry it deleted from its own branch scope).
      # Saving on the valid-hit path would just waste time compressing ~200MB
      # to be told the key already exists. always() so a save still happens
      # even if a LATER step in this job fails - matching what the combined
      # actions/cache@v4 action's post-job save hook used to do, and making
      # sure a good SDK download isn't thrown away just because, say, the
      # subsequent .NET build failed for an unrelated reason.
      - name: Save OCCT SDK cache
        if: always() && steps.occt-build.outputs.sdk-changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\OCCT
          key: ${{ steps.occt-cache.outputs.cache-primary-key }}

      # actions/cache/save swallows its own failures (a reserveCache 409 is
      # logged, not thrown), so a green save step is NOT evidence the entry
      # exists. Ask the API. Reports only - never fails the build, because
      # producing the installer does not depend on the cache being written;
      # the warmer (occt-cache-warm.yml), whose only purpose IS the cache,
      # does fail in the equivalent situation.
      - name: Report OCCT SDK cache outcome
        if: always() && steps.occt-build.outputs.sdk-changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          OCCT_CACHE_KEY: ${{ steps.occt-cache.outputs.cache-primary-key }}
        run: |
          $entries = & gh cache list --key $env:OCCT_CACHE_KEY --ref $env:GITHUB_REF --repo $env:GITHUB_REPOSITORY --json key,ref,sizeInBytes 2>$null | ConvertFrom-Json
          # --key is a PREFIX filter, so match the exact key ourselves.
          $mine = @($entries | Where-Object { $_.key -eq $env:OCCT_CACHE_KEY -and $_.ref -eq $env:GITHUB_REF })

          if ($mine.Count -gt 0) {
            Write-Host "OCCT SDK cache: saved under key '$($env:OCCT_CACHE_KEY)' in this branch's scope ($($env:GITHUB_REF)), $([math]::Round($mine[0].sizeInBytes / 1MB, 1)) MB. Subsequent runs on this branch will restore it."
          } else {
            Write-Host "::warning::OCCT SDK cache was NOT written for key '$($env:OCCT_CACHE_KEY)' in $($env:GITHUB_REF). This run's build is unaffected, but the next run on this branch will download the SDK cold again."
          }

          if ($env:GITHUB_REF -ne 'refs/heads/master') {
            Write-Host "Note: this workflow only ever writes its OWN branch scope. New branches inherit the master-scoped entry, which only 'Warm OCCT SDK cache (default branch)' maintains."
          }

      - name: Restore (single node)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild `
            '.\BuildAll_Release.csproj' `
            '/t:Restore' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release' `
            '/p:UseSharedCompilation=false'

      - name: Rebuild (single node)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild `
            '.\BuildAll_Release.csproj' `
            '/t:Rebuild' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release' `
            '/p:UseSharedCompilation=false'

      - name: Restore SAM_UI
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $sln = 'SAM_UI\SAM_UI.sln'
          if (-not (Test-Path $sln)) {
            Write-Host "WARN: $sln not found; skipping SAM_UI restore."
            return
          }

          msbuild `
            $sln `
            '/t:Restore' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release' `
            '/p:UseSharedCompilation=false'

      - name: Rebuild SAM_UI (with post-build)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $sln = 'SAM_UI\SAM_UI.sln'
          if (-not (Test-Path $sln)) {
            Write-Host "WARN: $sln not found; skipping SAM_UI rebuild."
            return
          }

          msbuild `
            $sln `
            '/t:Rebuild' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release' `
            '/p:UseSharedCompilation=false' `
            '/p:RunPostBuildEvent=OnOutputUpdated'

      - name: Restore SAM_Rhino_UI
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $sln = 'SAM_Rhino_UI\SAM_Rhino_UI.sln'
          if (-not (Test-Path $sln)) {
            Write-Host "WARN: $sln not found; skipping SAM_Rhino_UI restore."
            return
          }

          msbuild `
            $sln `
            '/t:Restore' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release' `
            '/p:UseSharedCompilation=false'

      # NOTE: SAM_Revit_UI is NOT restored here, per Revit year, ahead of the rebuilds.
      # obj\project.assets.json is one file per project, not one per configuration, so
      # restoring 2025 then 2026 then 2027 in a row leaves it holding only the LAST
      # restore's target framework. While every year was net8.0-windows that was
      # invisible; Revit 2027 restores net10.0-windows, so the Release2025 rebuild would
      # then fail NETSDK1005 ("doesn't have a target for net8.0-windows") even though
      # nothing about 2025 changed. Each year's restore is folded into that same year's
      # rebuild step below instead.

      - name: Rebuild SAM_Rhino_UI (with post-build)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $sln = 'SAM_Rhino_UI\SAM_Rhino_UI.sln'
          if (-not (Test-Path $sln)) {
            Write-Host "WARN: $sln not found; skipping SAM_Rhino_UI rebuild."
            return
          }

          msbuild `
            $sln `
            '/t:Rebuild' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release' `
            '/p:UseSharedCompilation=false' `
            '/p:RunPostBuildEvent=OnOutputUpdated'

      - name: Rebuild SAM_Revit_UI 2025 (with post-build)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $sln = 'SAM_Revit_UI\SAM_Revit_UI.sln'
          if (-not (Test-Path $sln)) {
            Write-Host "WARN: $sln not found; skipping SAM_Revit_UI rebuild."
            return
          }

          # Restore immediately before this year's rebuild, not batched with the other
          # years - see the note above the SAM_Rhino_UI rebuild step.
          msbuild `
            $sln `
            '/t:Restore' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release2025' `
            '/p:UseSharedCompilation=false'

          msbuild `
            $sln `
            '/t:Rebuild' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release2025' `
            '/p:UseSharedCompilation=false' `
            '/p:RunPostBuildEvent=OnOutputUpdated'

      - name: Snapshot Revit 2025 outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE\.github\scripts\snapshot-revit-build.ps1" -Year '2025'

      - name: Rebuild SAM_Revit_UI 2026 (with post-build)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $sln = 'SAM_Revit_UI\SAM_Revit_UI.sln'
          if (-not (Test-Path $sln)) {
            Write-Host "WARN: $sln not found; skipping SAM_Revit_UI rebuild."
            return
          }

          msbuild `
            $sln `
            '/t:Restore' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release2026' `
            '/p:UseSharedCompilation=false'

          msbuild `
            $sln `
            '/t:Rebuild' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release2026' `
            '/p:UseSharedCompilation=false' `
            '/p:RunPostBuildEvent=OnOutputUpdated'

      - name: Snapshot Revit 2026 outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE\.github\scripts\snapshot-revit-build.ps1" -Year '2026'

      - name: Rebuild SAM_Revit_UI 2027 (with post-build)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $sln = 'SAM_Revit_UI\SAM_Revit_UI.sln'
          if (-not (Test-Path $sln)) {
            Write-Host "WARN: $sln not found; skipping SAM_Revit_UI rebuild."
            return
          }

          msbuild `
            $sln `
            '/t:Restore' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release2027' `
            '/p:UseSharedCompilation=false'

          msbuild `
            $sln `
            '/t:Rebuild' `
            '/m:1' '/nr:false' '/v:m' `
            '/p:Configuration=Release2027' `
            '/p:UseSharedCompilation=false' `
            '/p:RunPostBuildEvent=OnOutputUpdated'

      - name: Snapshot Revit 2027 outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE\.github\scripts\snapshot-revit-build.ps1" -Year '2027'

      # -----------------------------------------------------------------------
      # STAGING: build a curated payload that matches the older working pipeline
      # -----------------------------------------------------------------------
      - name: Stage payload for installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $root   = (Get-Location).Path
          $issDir = Join-Path $root 'SAM_Installer'
          $stage  = Join-Path $issDir 'build'
          $samStage = Join-Path $stage 'SAM'
          $samAppData = Join-Path $env:APPDATA 'SAM'

          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path $samStage | Out-Null

          function Copy-IfExists([string]$src,[string]$dest) {
            if (Test-Path $src) {
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
              Copy-Item "$src\*" $dest -Recurse -Force
            }
            else {
              Write-Host "WARN: $src not found (skipped)"
            }
          }

          # Keep special payloads separate / restore old pipeline behaviour
          Copy-IfExists (Join-Path $root 'Install')              $stage
          Copy-IfExists (Join-Path $root 'SAM_Windows\build')   (Join-Path $stage 'SAMdependencies')
          Copy-IfExists (Join-Path $root 'SAM_Revit\references') (Join-Path $stage 'Rhino.Inside')

          # Prefer the curated runtime payload produced by the build itself
          if (-not (Test-Path $samAppData)) {
            throw "Expected curated runtime payload at $samAppData, but it was not created by the build. Refusing to package a guessed mixed payload."
          }
          Copy-IfExists $samAppData $samStage

          # Force correct .NET 8 WindowsDesktop runtime files for standalone SAM_UI apps.
          # The installed payload may already contain older copies from mixed module outputs;
          # always overwrite them with the runtime version that matches the built apps.
          $desktopSharedRoot = Join-Path ${env:ProgramFiles} 'dotnet\shared\Microsoft.WindowsDesktop.App'
          if (-not (Test-Path $desktopSharedRoot)) {
            throw "Microsoft.WindowsDesktop.App shared runtime not found at $desktopSharedRoot"
          }

          $desktopRuntimeDir = Get-ChildItem -Path $desktopSharedRoot -Directory -ErrorAction Stop |
            Where-Object { $_.Name -match '^8\.0\.' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1

          if (-not $desktopRuntimeDir) {
            throw "No Microsoft.WindowsDesktop.App 8.0.x runtime found under $desktopSharedRoot"
          }

          Write-Host "Using WindowsDesktop runtime from: $($desktopRuntimeDir.FullName)"

          $desktopRuntimeFiles = @(
            'System.Drawing.Common.dll',
            'Microsoft.Win32.SystemEvents.dll'
          )

          foreach ($name in $desktopRuntimeFiles) {
            $srcFile = Join-Path $desktopRuntimeDir.FullName $name
            if (-not (Test-Path $srcFile)) {
              throw "Required runtime file not found: $srcFile"
            }
            Copy-Item $srcFile (Join-Path $samStage $name) -Force
            Write-Host "Pinned runtime file: $name"
          }

          # Force SAM_UI-managed dependency versions that must not drift to older shared copies.
          # These files are required by standalone UI and UI launched from Grasshopper.
          $preferredUiRuntimeFiles = @(
            'System.Memory.dll',
            'System.Numerics.Vectors.dll'
          )

          $uiBuildDir = Join-Path $root 'SAM_UI\build'
          if (-not (Test-Path $uiBuildDir)) {
            throw "Required SAM_UI build output folder not found: $uiBuildDir"
          }

          foreach ($name in $preferredUiRuntimeFiles) {
            $srcFile = Join-Path $uiBuildDir $name
            if (-not (Test-Path $srcFile)) {
              throw "Required SAM UI dependency not found in SAM_UI\build: $name"
            }

            $stageFile = Join-Path $samStage $name
            Copy-Item $srcFile $stageFile -Force

            $uiBuildVer = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($srcFile).FileVersion
            $stageVer = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($stageFile).FileVersion

            Write-Host ("Pinned SAM UI dependency: {0} from {1}" -f $name, $srcFile)
            Write-Host ("SAM_UI\build version for {0}: {1}" -f $name, $uiBuildVer)
            Write-Host ("Final staged version for {0}: {1}" -f $name, $stageVer)
          }

          # User files / Grasshopper user objects
          Copy-IfExists (Join-Path $env:USERPROFILE 'Documents\SAM') (Join-Path $stage 'user\Documents\SAM')
          Copy-IfExists (Join-Path $env:APPDATA 'Grasshopper\UserObjects\SAM') (Join-Path $stage 'user\Documents\SAM\Grasshopper\UserObjects')
          Copy-IfExists (Join-Path $env:APPDATA 'Grasshopper\UserObjects\SAM') (Join-Path $stage 'SAMdependencies\GHUserObjects\SAM')

          # Revit add-in template must sit in SAM root for installer code
          $addinTemplate = Join-Path $root 'SAM_Revit_UI\files\Addin\SAM.addin'
          if (Test-Path $addinTemplate) {
            Copy-Item $addinTemplate $samStage -Force
          } else {
            Write-Host "WARN: Revit add-in template not found at $addinTemplate"
          }

          # Overlay Revit-specific outputs only. Do NOT seed year folders with all root DLLs.
          $revitYears = @('2025','2026','2027')
          # _revitsnap holds one folder per Revit year, captured right after that year was
          # rebuilt. It is listed first and carries the highest weight below, because
          # SAM_Revit\build and SAM_Revit_UI\build are a SINGLE shared directory that each
          # Release20xx rebuild overwrites - files taken straight from there carry no year in
          # their path, match no year, and would be published to all three.
          $revitRoots = @(
            (Join-Path $root '_revitsnap'),
            (Join-Path $root 'SAM_Revit'),
            (Join-Path $root 'SAM_Revit_UI')
          )
          $revitNameRegex = '^SAM\..*Revit.*\.(dll|pdb|xml|config|json)$'
          $best = @{}
          foreach ($year in $revitYears) { $best[$year] = @{} }

          foreach ($rr in $revitRoots) {
            if (-not (Test-Path $rr)) { continue }

            Get-ChildItem -Path $rr -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -match $revitNameRegex -and
                $_.FullName -notmatch '\\obj\\' -and
                $_.FullName -notmatch '\\ref\\' -and
                $_.FullName -notmatch '\\packages\\'
              } | ForEach-Object {
                $f = $_
                $targets = @()
                if ($f.FullName -match '2025') { $targets += '2025' }
                if ($f.FullName -match '2026') { $targets += '2026' }
                if ($f.FullName -match '2027') { $targets += '2027' }
                if ($targets.Count -eq 0) { $targets = $revitYears }

                $w = 0
                if ($f.FullName -match '\\_revitsnap\\') { $w = 3 }
                elseif ($f.FullName -match '\\build\\') { $w = 2 }
                elseif ($f.FullName -match '\\bin\\') { $w = 1 }

                foreach ($year in $targets) {
                  $existing = $best[$year][$f.Name]
                  if (-not $existing -or
                      $w -gt $existing.Weight -or
                      ($w -eq $existing.Weight -and $f.LastWriteTime -gt $existing.File.LastWriteTime)) {
                    $best[$year][$f.Name] = [pscustomobject]@{ Weight = $w; File = $f }
                  }
                }
              }
          }

          foreach ($year in $revitYears) {
            $targetDir = Join-Path $samStage ("Revit $year")
            New-Item -ItemType Directory -Force -Path $targetDir | Out-Null

            foreach ($kvp in $best[$year].GetEnumerator()) {
              Copy-Item $kvp.Value.File.FullName (Join-Path $targetDir $kvp.Key) -Force
            }

            # No overlay from the shared SAM_Revit_UI\build folder: it holds only the LAST
            # rebuilt configuration (Release2027 = net10), so copying it into every year
            # folder would poison the net8 payloads for 2025/2026. SAM.Revit.UI.dll and
            # SAM.Core.Revit.UI.dll already come from the per-year _revitsnap snapshots above
            # (weight 3), and the loader check below fails loudly if one is missing.

            Get-ChildItem -Path $targetDir -File -Filter *.dll -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match 'Grasshopper' } |
              ForEach-Object {
                $gha = [IO.Path]::ChangeExtension($_.FullName, '.gha')
                Copy-Item $_.FullName $gha -Force
              }

            # Safety: if we staged any Revit payload for this year, ensure the add-in loader exists.
            $hasRevitDlls = (Get-ChildItem -Path $targetDir -File -Filter 'SAM.*Revit*.dll' -ErrorAction SilentlyContinue | Measure-Object).Count -gt 0
            $loader = Join-Path $targetDir 'SAM.Revit.UI.dll'
            if ($hasRevitDlls -and -not (Test-Path $loader)) {
              throw "Revit $year payload is missing SAM.Revit.UI.dll in $targetDir"
            }
          }

          # Root Grasshopper DLLs -> GHA
          Get-ChildItem -Path $samStage -File -Filter *.dll -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match '^SAM\..*Grasshopper.*\.dll$' -and
              $_.DirectoryName -notmatch '\\Revit\s20[0-9]{2}$'
            } |
            ForEach-Object {
              $gha = [IO.Path]::ChangeExtension($_.FullName, '.gha')
              Copy-Item $_.FullName $gha -Force
            }

          # Remove host-provided / conflicting DLLs from staged SAM payload.
          # This mirrors the older Hoare Lea pipeline and avoids packaging host assemblies.
          $deleteNames = @(
            'Eto.dll',
            'GH_IO.dll',
            'Grasshopper.dll',
            'RevitAPIIFC.dll',
            'Rhino.UI.dll',
            'RhinoCommon.dll',
            'RevitNodes.dll',
            'RevitServices.dll',
            'RhinoInside.Revit.dll',
            'RhinoInside.Revit.GH.dll'
          )

          foreach ($name in $deleteNames) {
            Get-ChildItem -Path $samStage -Recurse -File -Filter $name -ErrorAction SilentlyContinue |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }

          # Safety: keep only Grasshopper GHAs
          Get-ChildItem -Path $samStage -Recurse -File -Filter 'SAM*.gha' -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch 'Grasshopper' } |
            Remove-Item -Force -ErrorAction SilentlyContinue

          # Rhino UI Yak-style package -> build\SAM_Rhino_UI\{manifest.txt,1.0.0\*}
          #
          # SAM_Rhino_UI is a single net8 RhinoCommon-based plugin whose PostBuild
          # deploys identically to the Rhino 8 and Rhino 9 package folders. Rhino 7
          # support was removed, so packages\7.0\SAM is never populated and must not
          # be used as a staging source (doing so silently produced an empty payload
          # and empty Rhino 8/9 install folders). The Rhino 8 package root is the
          # canonical source; Rhino 9 is verified to be an identical copy below.
          $yakRoot      = Join-Path $stage 'SAM_Rhino_UI'
          $yakVersion   = '1.0.0'
          $rhino8Root   = Join-Path $env:APPDATA 'McNeel\Rhinoceros\packages\8.0\SAM'
          $rhino9Root   = Join-Path $env:APPDATA 'McNeel\Rhinoceros\packages\9.0\SAM'
          $rhino8VerDir = Join-Path $rhino8Root $yakVersion
          $rhino9VerDir = Join-Path $rhino9Root $yakVersion

          # Fatal on every run (branch or tag): a branch installer artifact with an
          # empty Rhino package is not a valid build output.
          if (-not (Test-Path $rhino8VerDir)) {
            throw "Rhino 8 package output not found at $rhino8VerDir. SAM_Rhino_UI must build and deploy to the Rhino 8 package folder before staging."
          }
          if (-not (Test-Path $rhino9VerDir)) {
            throw "Rhino 9 package output not found at $rhino9VerDir. SAM_Rhino_UI must build and deploy to the Rhino 9 package folder before staging."
          }

          # Compare Rhino 8 vs Rhino 9 outputs by relative path + hash before trusting
          # either as canonical. Both come from the same build, so they must match.
          function Get-RelativeFileHashMap([string]$root) {
            $map = @{}
            Get-ChildItem -Path $root -Recurse -File | ForEach-Object {
              $rel = $_.FullName.Substring($root.Length).TrimStart('\')
              $map[$rel] = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
            }
            return $map
          }

          $rhino8Map = Get-RelativeFileHashMap $rhino8VerDir
          $rhino9Map = Get-RelativeFileHashMap $rhino9VerDir
          $allRelPaths = @($rhino8Map.Keys) + @($rhino9Map.Keys) | Sort-Object -Unique

          $diffs = @()
          foreach ($rel in $allRelPaths) {
            $h8 = $rhino8Map[$rel]
            $h9 = $rhino9Map[$rel]
            if ($h8 -ne $h9) {
              $diffs += [pscustomobject]@{ RelativePath = $rel; Rhino8 = $h8; Rhino9 = $h9 }
            }
          }

          if ($diffs.Count -gt 0) {
            Write-Host "Rhino 8 vs Rhino 9 package contents differ:"
            $diffs | ForEach-Object {
              Write-Host ("  {0}: rhino8={1} rhino9={2}" -f $_.RelativePath, $_.Rhino8, $_.Rhino9)
            }
            throw "Rhino 8 and Rhino 9 package outputs are expected to be identical (same net8 RhinoCommon plugin) but $($diffs.Count) file(s) differ. Refusing to silently pick one - see diffs above."
          }
          Write-Host "Rhino 8 / Rhino 9 package comparison: $($allRelPaths.Count) file(s) checked, all identical."

          # Stage the complete Rhino 8 package root (manifest.txt + version dir), not
          # just the contents of 1.0.0, so the manifest travels with the installer.
          if (Test-Path $yakRoot) { Remove-Item $yakRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $yakRoot | Out-Null
          Write-Host "Staging Rhino payload from $rhino8Root -> $yakRoot"
          Copy-Item "$rhino8Root\*" $yakRoot -Recurse -Force

          $yakVersionDir = Join-Path $yakRoot $yakVersion
          $manifestPath  = Join-Path $yakRoot 'manifest.txt'

          if (-not (Test-Path $manifestPath)) {
            throw "Rhino package manifest.txt not found at $manifestPath after staging from $rhino8Root."
          }
          $manifestSelectedVersion = (Get-Content -Path $manifestPath -Raw).Trim()
          if ($manifestSelectedVersion -ne $yakVersion) {
            throw "Rhino package manifest.txt selects '$manifestSelectedVersion', expected '$yakVersion'."
          }

          if (-not (Test-Path $yakVersionDir)) {
            throw "Rhino package version directory not found at $yakVersionDir after staging."
          }

          $stagedRhinoFiles = @(Get-ChildItem -Path $yakVersionDir -Recurse -File -ErrorAction SilentlyContinue)
          if ($stagedRhinoFiles.Count -eq 0) {
            throw "Rhino package staging folder is empty: $yakVersionDir"
          }

          $requiredRhp = @('SAM.Analytical.Rhino.UI.rhp', 'SAM.Analytical.Rhino.Solver.UI.rhp')
          foreach ($rhp in $requiredRhp) {
            if (-not ($stagedRhinoFiles | Where-Object { $_.Name -ieq $rhp })) {
              throw "Required Rhino plugin '$rhp' not found in staged package: $yakVersionDir"
            }
          }

          $stdole = $stagedRhinoFiles | Where-Object { $_.Name -ieq 'stdole.dll' }
          if ($stdole) {
            throw "stdole.dll must not be packaged with SAM_Rhino_UI (breaks the Rhino 8/9 .NET compatibility check) - found at $($stdole.FullName)"
          }

          Write-Host "Rhino package staging assertions:"
          Write-Host "  manifest.txt         : OK (selects $manifestSelectedVersion)"
          Write-Host "  $yakVersionDir : OK ($($stagedRhinoFiles.Count) file(s))"
          foreach ($rhp in $requiredRhp) { Write-Host "  $rhp : OK" }
          Write-Host "  stdole.dll            : absent (OK)"
          Write-Host "  Rhino 7 staging path  : not used (OK) - single canonical root shared by 8.0 and 9.0"
          Write-Host "Staged Rhino package inventory:"
          $stagedRhinoFiles | Sort-Object FullName | ForEach-Object {
            Write-Host "    $($_.FullName.Substring($yakRoot.Length).TrimStart('\'))"
          }

          $samFiles = @(Get-ChildItem -Path $samStage -Recurse -File -ErrorAction SilentlyContinue)
          Write-Host "Staged SAM payload files: $($samFiles.Count)"
          $samVerEnv = if ($env:SAMVersion) { $env:SAMVersion } else { '<unset>' }
          $infoVerEnv = if ($env:InformationalVersion) { $env:InformationalVersion } else { '<unset>' }
          Write-Host "Effective SAMVersion env value:          $samVerEnv"
          Write-Host "Effective InformationalVersion env value: $infoVerEnv"
          Write-Host "Top-level staged SAM DLLs (FileVersion + ProductVersion = SHA-tagged content identity):"
          # Explicit column formatting via -f rather than Format-Table -AutoSize, because the
          # CI terminal width auto-detection silently drops right-most columns when the table
          # is wider than the assumed buffer (~120 chars).
          $hdr = '{0,-62} {1,10} {2,-22} {3}' -f 'Name', 'Length', 'FileVersion', 'ProductVersion'
          Write-Host $hdr
          Write-Host ('-' * $hdr.Length)
          Get-ChildItem -Path $samStage -File -Filter *.dll -ErrorAction SilentlyContinue |
            Sort-Object Name |
            ForEach-Object {
              $fi = try { [System.Diagnostics.FileVersionInfo]::GetVersionInfo($_.FullName) } catch { $null }
              $fv = if ($fi) { $fi.FileVersion } else { '<unreadable>' }
              $pv = if ($fi) { $fi.ProductVersion } else { '<unreadable>' }
              Write-Host ('{0,-62} {1,10} {2,-22} {3}' -f $_.Name, $_.Length, $fv, $pv)
            }

          foreach ($year in $revitYears) {
            $targetDir = Join-Path $samStage ("Revit $year")
            $dllCount = (Get-ChildItem -Path $targetDir -File -Filter *.dll -ErrorAction SilentlyContinue | Measure-Object).Count
            $ghaCount = (Get-ChildItem -Path $targetDir -File -Filter *.gha -ErrorAction SilentlyContinue | Measure-Object).Count
            $hasRevitLoader = Test-Path (Join-Path $targetDir 'SAM.Revit.UI.dll')
            Write-Host "Revit $year staged: DLL=$dllCount, GHA=$ghaCount, Loader=$hasRevitLoader"
          }

          # -------------------------------------------------------------------
          # Assert each year's payload was actually built for THAT year.
          #
          # File counts alone cannot show this: most of a year folder is
          # year-agnostic SAM DLLs, so a payload assembled from the wrong year
          # has the same count as a correct one. Before per-year snapshots
          # existed, "Revit 2027" was staged from whatever built last and still
          # reported a plausible DLL count with Loader=True.
          #
          # The TargetFramework attribute is the thing that actually differs:
          # Revit 2025/2026 are net8.0-windows, Revit 2027 is net10.0-windows.
          # Shipping a net10 assembly to Revit 2025 (or vice versa) produces an
          # add-in that cannot load at all, so this is a hard failure.
          # -------------------------------------------------------------------
          $expectedTfm = @{ '2025' = 'v8.0'; '2026' = 'v8.0'; '2027' = 'v10.0' }
          $tfmProbe = 'SAM.Analytical.Revit.UI.dll'
          $tfmFailures = @()

          foreach ($year in $revitYears) {
            $probePath = Join-Path (Join-Path $samStage ("Revit $year")) $tfmProbe
            if (-not (Test-Path $probePath)) {
              $tfmFailures += "Revit ${year}: $tfmProbe missing from payload"
              continue
            }

            $raw = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($probePath))
            $m = [regex]::Match($raw, '\.NETCoreApp,Version=v(\d+\.\d+)')
            if (-not $m.Success) {
              $tfmFailures += "Revit ${year}: could not read TargetFramework from $tfmProbe"
              continue
            }

            $found = 'v' + $m.Groups[1].Value
            $want  = $expectedTfm[$year]
            if ($found -ne $want) {
              $tfmFailures += "Revit ${year}: expected $want but payload is $found"
            } else {
              Write-Host "Revit ${year} payload TargetFramework: .NETCoreApp $found (expected $want) OK"
            }
          }

          if ($tfmFailures.Count -gt 0) {
            $tfmFailures | ForEach-Object { Write-Host "PAYLOAD TFM ERROR: $_" }
            throw "One or more Revit payloads were built for the wrong target framework."
          }

          # -------------------------------------------------------------------
          # STAGE 2.2 OWNERSHIP POLICY + DIAGNOSTICS
          #
          # Policy:
          # - WindowsDesktop runtime files are pinned from the installed .NET runtime
          # - UI-critical pinned files are owned by SAM_UI\build
          # - reviewed UI-match files are expected to stage to the SAM_UI version
          # - accepted drift is tracked but not treated as a failure
          # - unclassified drift is warning-only by default, with optional strict mode
          # -------------------------------------------------------------------
          function Get-FileVersionSafe([string]$path) {
            if (-not (Test-Path $path)) { return $null }
            try {
              return [System.Diagnostics.FileVersionInfo]::GetVersionInfo($path).FileVersion
            }
            catch {
              return $null
            }
          }

          $uiOwnedPinnedFiles = @(
            'System.Memory.dll',
            'System.Numerics.Vectors.dll'
          )

          $uiOwnedReviewedMatchFiles = @(
            'Microsoft.CSharp.dll',
            'System.Buffers.dll',
            'System.Runtime.CompilerServices.Unsafe.dll'
          )

          $knownAcceptedDriftFiles = @(
            'System.Drawing.Common.dll',
            'System.Drawing.Primitives.dll',
            'System.Data.DataSetExtensions.dll',
            'System.Reflection.Emit.ILGeneration.dll',
            'System.Reflection.Emit.Lightweight.dll'
          )

          Write-Host '--- Stage 2.2 ownership policy summary ---'
          Write-Host ('Pinned UI owner files: ' + ($uiOwnedPinnedFiles -join ', '))
          Write-Host ('Reviewed UI match files: ' + ($uiOwnedReviewedMatchFiles -join ', '))
          Write-Host ('Known accepted drift files: ' + ($knownAcceptedDriftFiles -join ', '))
          Write-Host ("STRICT_UNCLASSIFIED_DRIFT={0}" -f $env:STRICT_UNCLASSIFIED_DRIFT)

          $diagnosticRoots = @(
            [pscustomobject]@{ Name = 'SAM_build';    Path = (Join-Path $root 'SAM\build') },
            [pscustomobject]@{ Name = 'SAM_UI_build'; Path = (Join-Path $root 'SAM_UI\build') },
            [pscustomobject]@{ Name = 'APPDATA_SAM';  Path = $samAppData },
            [pscustomobject]@{ Name = 'STAGED_SAM';   Path = $samStage }
          ) | Where-Object { Test-Path $_.Path }

          $dllIndex = @{}
          foreach ($entry in $diagnosticRoots) {
            Get-ChildItem -Path $entry.Path -File -Filter *.dll -ErrorAction SilentlyContinue | ForEach-Object {
              if (-not $dllIndex.ContainsKey($_.Name)) {
                $dllIndex[$_.Name] = @()
              }

              $dllIndex[$_.Name] += [pscustomobject]@{
                Source  = $entry.Name
                Path    = $_.FullName
                Version = Get-FileVersionSafe $_.FullName
              }
            }
          }

          Write-Host '--- Stage 2.2 DLL version diagnostics ---'
          $reviewedResults = @()
          $unclassifiedDriftResults = @()

          foreach ($name in ($dllIndex.Keys | Sort-Object)) {
            $items = @($dllIndex[$name])
            if ($items.Count -lt 2) { continue }

            $versions = @(
              $items |
                ForEach-Object { if ($_.Version) { $_.Version } else { '<unknown>' } } |
                Sort-Object -Unique
            )

            if ($versions.Count -le 1) { continue }

            $classification = 'UNCLASSIFIED_DRIFT'
            if ($uiOwnedPinnedFiles -contains $name) {
              $classification = 'PINNED_UI_OWNER'
            }
            elseif ($uiOwnedReviewedMatchFiles -contains $name) {
              $classification = 'REVIEWED_UI_MATCH'
            }
            elseif ($knownAcceptedDriftFiles -contains $name) {
              $classification = 'KNOWN_ACCEPTED_DRIFT'
            }

            Write-Host ("DLL version drift detected [{0}]: {1}" -f $classification, $name)
            foreach ($item in ($items | Sort-Object Source)) {
              $ver = if ($item.Version) { $item.Version } else { '<unknown>' }
              Write-Host ("  {0} -> {1}" -f $item.Source, $ver)
            }

            $uiItem = $items | Where-Object { $_.Source -eq 'SAM_UI_build' } | Select-Object -First 1
            $stagedItem = $items | Where-Object { $_.Source -eq 'STAGED_SAM' } | Select-Object -First 1

            if ($classification -eq 'REVIEWED_UI_MATCH') {
              $status = 'INSUFFICIENT_DATA'
              if ($uiItem -and $stagedItem -and $uiItem.Version -and $stagedItem.Version) {
                if ($uiItem.Version -eq $stagedItem.Version) {
                  $status = 'STAGED_MATCHES_UI'
                }
                else {
                  $status = 'STAGED_DIFFERS_FROM_UI'
                }
              }

              $reviewedResults += [pscustomobject]@{
                Name = $name
                UIVersion = if ($uiItem) { $uiItem.Version } else { $null }
                StagedVersion = if ($stagedItem) { $stagedItem.Version } else { $null }
                Status = $status
              }

              if ($uiItem -and $uiItem.Version) {
                Write-Host ("  Reviewed UI match target: SAM_UI_build ({0})" -f $uiItem.Version)
              }
              Write-Host ("  Reviewed UI match status: {0}" -f $status)
            }
            elseif ($classification -eq 'UNCLASSIFIED_DRIFT') {
              $unclassifiedDriftResults += [pscustomobject]@{
                Name = $name
                UIVersion = if ($uiItem) { $uiItem.Version } else { $null }
                StagedVersion = if ($stagedItem) { $stagedItem.Version } else { $null }
              }
              Write-Warning ("UNCLASSIFIED drift detected for {0}. Review ownership before next release." -f $name)
            }
          }

          Write-Host '--- Stage 2.2 reviewed UI match summary ---'
          foreach ($result in ($reviewedResults | Sort-Object Name)) {
            $uiVer = if ($result.UIVersion) { $result.UIVersion } else { '<missing>' }
            $stagedVer = if ($result.StagedVersion) { $result.StagedVersion } else { '<missing>' }
            Write-Host ("REVIEWED {0} | UI={1} | STAGED={2} | STATUS={3}" -f $result.Name, $uiVer, $stagedVer, $result.Status)
          }

          Write-Host '--- Stage 2.2 unclassified drift summary ---'
          if ($unclassifiedDriftResults.Count -eq 0) {
            Write-Host 'No unclassified DLL drift detected.'
          }
          else {
            foreach ($result in ($unclassifiedDriftResults | Sort-Object Name)) {
              $uiVer = if ($result.UIVersion) { $result.UIVersion } else { '<missing>' }
              $stagedVer = if ($result.StagedVersion) { $result.StagedVersion } else { '<missing>' }
              Write-Host ("UNCLASSIFIED {0} | UI={1} | STAGED={2}" -f $result.Name, $uiVer, $stagedVer)
            }

            if ($env:STRICT_UNCLASSIFIED_DRIFT -eq 'true') {
              throw 'Unclassified DLL drift detected and STRICT_UNCLASSIFIED_DRIFT=true.'
            }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Package installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $issDir = Resolve-Path 'SAM_Installer' -ErrorAction Stop
          $iscc   = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found." }

          $outDir = Join-Path $issDir '..\dist'
          if (-not (Test-Path $outDir)) {
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          }

          $raw   = '${{ steps.ver.outputs.version }}'
          if (-not $raw) { $raw = 'v_local' }
          $safe  = ($raw -replace '[^0-9A-Za-z_.-]','_')
          $fname = "SAM_Install_$safe"

          Push-Location $issDir
          try {
            & $iscc "/O$outDir" "/F$fname" "/DVersion=$raw" "/DAppVersion=$raw" "Build_Installer.iss"
            if ($LASTEXITCODE -ne 0) {
              throw "ISCC failed ($LASTEXITCODE)"
            }
          }
          finally {
            Pop-Location
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAM_Install
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: SAM_Install
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name:     ${{ needs.build.outputs.version }}
          files:    ./dist/*.exe

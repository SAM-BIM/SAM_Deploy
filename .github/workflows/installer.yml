name: Build & Release SAM-BIM Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v20251215.1). If empty, a timestamp is used.'
        required: false
        default: ''
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.ver.outputs.version }}
    permissions:
      contents: read

    steps:
      - name: Checkout (with private submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          if (-not $tag -or -not $tag.StartsWith('v')) { $tag = "${{ github.event.inputs.version }}" }
          if (-not $tag) { $tag = "v$(Get-Date -Format yyyyMMdd).${{ github.run_number }}" }
          "version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore (single node)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          msbuild .\BuildAll_Release_net.csproj /t:Restore /m:1 /nr:false /v:m `
            /p:Configuration=Release /p:UseSharedCompilation=false `
            /p:RunPostBuildEvent=OnOutputUpdated /p:PostBuildEvent=

      - name: Rebuild (single node)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          msbuild .\BuildAll_Release_net.csproj /t:Rebuild /m:1 /nr:false /v:m `
            /p:Configuration=Release /p:UseSharedCompilation=false `
            /p:RunPostBuildEvent=OnOutputUpdated /p:PostBuildEvent=

      - name: Stage payload for installer
        shell: pwsh
        run: |
          $root  = (Get-Location).Path
          $issDir = Join-Path $root 'SAM_Installer'
          $stage = Join-Path $issDir 'build'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          function Copy-IfExists([string]$src,[string]$dest) {
            if (Test-Path $src) {
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
              Copy-Item "$src\*" $dest -Recurse -Force
            } else { Write-Host "WARN: $src not found (skipped)" }
          }

          Copy-IfExists (Join-Path $root 'SAM_UI\build')           (Join-Path $stage 'SAM')
          Copy-IfExists (Join-Path $root 'SAM_Windows\build')      (Join-Path $stage 'SAMdependencies')
          Copy-IfExists (Join-Path $root 'SAM_Revit\references')   (Join-Path $stage 'Rhino.Inside')
          Copy-IfExists (Join-Path $root 'SAM_Rhino_UI\build')     (Join-Path $stage 'SAM_Rhino_UI')
          Copy-IfExists (Join-Path $root 'Documents\SAM')          (Join-Path $stage 'user\Documents\SAM')

          Copy-Item (Join-Path $issDir 'register.bat')   (Join-Path $stage 'register.bat')   -Force -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $issDir 'deregister.bat') (Join-Path $stage 'deregister.bat') -Force -ErrorAction SilentlyContinue

          $addin = Join-Path $root 'SAM_Revit_UI\files\Addin\SAM.addin'
          if (Test-Path $addin) {
            New-Item -ItemType Directory -Force -Path (Join-Path $stage 'SAM') | Out-Null
            Copy-Item $addin (Join-Path $stage 'SAM') -Force
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      # Generate a fresh CI .iss with NO OutputBaseFileName/OutputDir lines
      - name: Generate CI .iss
        shell: pwsh
        run: |
          $issDir = Resolve-Path 'SAM_Installer' -ErrorAction Stop
          $ci  = Join-Path $issDir 'Build_Installer.CI.iss'
          @"
#define AppVersion "${{ steps.ver.outputs.version }}"

[Setup]
AppId={{6770DD83-5694-4607-8703-B3D3AC3CFD3C}}
AppName=SAM
AppPublisher=SAM-BIM
AppVersion={#AppVersion}
DefaultDirName={userappdata}\SAM
DisableDirPage=yes
DefaultGroupName=SAM
DisableProgramGroupPage=yes
Compression=lzma
SolidCompression=yes
PrivilegesRequired=lowest
SetupIconFile={#SourcePath}SAM20new.ico

[Dirs]
Name: "{userappdata}\SAM"

[Files]
Source: "build\SAM\*";                 DestDir: "{userappdata}\SAM";                                Flags: ignoreversion recursesubdirs createallsubdirs skipifsourcedoesntexist
Source: "build\SAMdependencies\*";     DestDir: "{userappdata}\SAM\SAMdependencies";                Flags: ignoreversion recursesubdirs createallsubdirs skipifsourcedoesntexist
Source: "build\Rhino.Inside\*";        DestDir: "{userappdata}\SAM\Rhino.Inside";                   Flags: ignoreversion recursesubdirs createallsubdirs skipifsourcedoesntexist
Source: "build\SAM_Rhino_UI\*";        DestDir: "{userappdata}\McNeel\Rhinoceros\packages\7.0\SAM"; Flags: ignoreversion recursesubdirs createallsubdirs skipifsourcedoesntexist
Source: "build\SAM_Rhino_UI\*";        DestDir: "{userappdata}\McNeel\Rhinoceros\packages\8.0\SAM"; Flags: ignoreversion recursesubdirs createallsubdirs skipifsourcedoesntexist
Source: "build\register.bat";          DestDir: "{userappdata}\SAM";                                Flags: ignoreversion skipifsourcedoesntexist
Source: "build\deregister.bat";        DestDir: "{userappdata}\SAM";                                Flags: ignoreversion skipifsourcedoesntexist
Source: "build\user\Documents\SAM\*";  DestDir: "{userdocs}\SAM";                                   Flags: onlyifdoesntexist recursesubdirs createallsubdirs skipifsourcedoesntexist

[Run]
Filename: "{userappdata}\SAM\SAMdependencies\install.bat"; WorkingDir: "{userappdata}\SAM\SAMdependencies"; Flags: runascurrentuser runhidden; Check: FileExists(ExpandConstant('{userappdata}\SAM\SAMdependencies\install.bat'))
Filename: "{userappdata}\SAM\register.bat";                WorkingDir: "{userappdata}\SAM";                 Flags: runascurrentuser runhidden; Check: FileExists(ExpandConstant('{userappdata}\SAM\register.bat'))

[UninstallRun]
Filename: "{userappdata}\SAM\deregister.bat";              WorkingDir: "{userappdata}\SAM";                 Flags: runascurrentuser runhidden; Check: FileExists(ExpandConstant('{userappdata}\SAM\deregister.bat'))

[UninstallDelete]
Type: filesandordirs; Name: "{userappdata}\SAM"
"@ | Set-Content -Path $ci -Encoding UTF8
          # sanity check: ensure no OutputBaseFileName/OutputDir left
          if (Select-String -Path $ci -Pattern 'OutputBaseFileName|OutputDir' -SimpleMatch) {
            throw 'CI .iss still has OutputBaseFileName/OutputDir'
          }

      - name: Compile installer (ISCC)
        shell: pwsh
        run: |
          $issDir = Resolve-Path 'SAM_Installer' -ErrorAction Stop
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found." }

          $outDir = Join-Path $pwd 'dist'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $safe  = ('${{ steps.ver.outputs.version }}' -replace '[^0-9A-Za-z_.-]','_')
          $fname = "SAM_Install_$safe"

          Push-Location $issDir
          try {
            & "$iscc" "/O`"$outDir`"" "/F`"$fname`"" "Build_Installer.CI.iss"
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          } finally { Pop-Location }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAM_Install
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: SAM_Install
          path: ./dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name:     ${{ needs.build.outputs.version }}
          files:    ./dist/*.exe

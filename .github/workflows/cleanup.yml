# .github/workflows/cleanup.yml
name: Cleanup old failed runs

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-workflow-runs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          delete_run_by_conclusion: failed,cancelled,startup_failure,timed_out
          retain_days: 14
          keep_minimum_runs: 0
          # No head_branch filter: clean failed/cancelled runs on every branch
          # (feature branches, tags, etc.), not just the default branch.
          workflow_id: installer.yml
